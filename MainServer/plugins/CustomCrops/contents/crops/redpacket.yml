redpacket:
  type: BLOCK
  pot-whitelist:
  - default
  seed: customcrops:redpacket_seeds
  random-rotation: true
  requirements:
    plant:
      requirement_1:
        type: season
        value:
        - Winter
        not-met-actions:
          actionbar_action:
            type: actionbar
            value: <red><bold>[X] It's not a good season to plant red packet tree
  events:
    plant:
      action_1:
        type: sound
        value:
          source: player
          key: minecraft:item.hoe.till
          volume: 1
          pitch: 1
    break:
      action_1:
        type: sound
        value:
          source: player
          key: minecraft:block.crop.break
          volume: 1
          pitch: 1
  max-points: 5
  points:
    '0':
      model: customcrops:redpacket_stage_1
      hologram-offset-correction: -0.4
    '1':
      model: customcrops:redpacket_stage_2
      hologram-offset-correction: -0.3
    '2':
      model: customcrops:redpacket_stage_3
      hologram-offset-correction: -0.2
    '3':
      model: customcrops:redpacket_stage_4
      hologram-offset-correction: -0.1
    '4':
      model: customcrops:redpacket_stage_5
      hologram-offset-correction: 0
    '5':
      model: customcrops:redpacket_stage_6
      hologram-offset-correction: 0
      events:
        break:
          action_1:
            type: drop-item
            value:
              ignore-fertilizer: false
              item: customcrops:redpacket
              min: 1
              max: 4
            chance: 1
        interact:
          empty_hand_action:
            type: conditional
            value:
              conditions:
                requirement_empty_hand:
                  type: item-in-hand
                  value:
                    item: AIR
              actions:
                action_0:
                  type: swing-hand
                  value: true
                action_1:
                  type: break
                  value: true
  grow-conditions:
    default:
      point: 1
      conditions:
        condition_1:
          type: suitable-season
          value:
          - Winter
        condition_2:
          type: water-more-than
          value: 0
  death-conditions:
    unsuitable_season:
      model: customcrops:crop_stage_death
      conditions:
        condition_1:
          type: unsuitable-season
          value:
          - Spring
          - Summer
          - Autumn
  custom-bone-meal: []