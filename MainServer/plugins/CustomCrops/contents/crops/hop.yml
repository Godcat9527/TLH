hop:
  type: BLOCK
  pot-whitelist:
  - default
  seed: customcrops:hop_seeds
  random-rotation: false
  requirements:
    plant:
      requirement_1:
        type: season
        value:
        - Summer
        not-met-actions:
          actionbar_action:
            type: actionbar
            value: <red><bold>[X] It's not a good season to plant hop
  events:
    plant:
      action_1:
        type: sound
        value:
          source: player
          key: minecraft:item.hoe.till
          volume: 1
          pitch: 1
    break:
      action_1:
        type: sound
        value:
          source: player
          key: minecraft:block.crop.break
          volume: 1
          pitch: 1
  max-points: 3
  points:
    '0':
      model: customcrops:hop_stage_1
      hologram-offset-correction: 0.6
    '1':
      model: customcrops:hop_stage_2
      hologram-offset-correction: 0.6
    '2':
      model: customcrops:hop_stage_3
      hologram-offset-correction: 0.6
    '3':
      model: customcrops:hop_stage_4
      hologram-offset-correction: 0.6
      events:
        break:
          action_1:
            type: quality-crops
            value:
              min: 2
              max: 5
              items:
                '1': customcrops:hop
                '2': customcrops:hop_silver_star
                '3': customcrops:hop_golden_star
        interact:
          empty_hand_action:
            type: conditional
            value:
              conditions:
                requirement_empty_hand:
                  type: item-in-hand
                  value:
                    item: AIR
              actions:
                action_0:
                  type: swing-hand
                  value: true
                action_1:
                  type: break
                  value: true
                action_2:
                  type: plant
                  value:
                    point: 0
                    crop: hop
  grow-conditions:
    default:
      point: 1
      conditions:
        condition_1:
          type: suitable-season
          value:
          - Summer
        condition_2:
          type: water-more-than
          value: 0
  death-conditions:
    unsuitable_season:
      model: customcrops:crop_stage_death
      conditions:
        condition_1:
          type: unsuitable-season
          value:
          - Spring
          - Winter
          - Autumn
    crow_attack:
      conditions:
        condition_1:
          type: crow-attack
          value:
            chance: 0.01
            fly-model: customcrops:crow_fly
            stand-model: customcrops:crow_stand
      delay: 150
  custom-bone-meal: []