cosmetics:

  # 使用ModelEngine实体创建的自定义气球示例（也支持动画ModelEngine实体模型）
  meg_amogus_balloon:
    enabled: true
    display_name: "阿莫古斯气球 (MEG)"
    type: MEG_BALLOON_ENTITY
    # 在GUI中显示不同的物品（在这种情况下是必需的，因为ModelEngine实体不能放在GUI中）
    model:
      gui: potion:400014
      normal: amogus
    dye:
      enabled: true
      default: "#ff0000"

  # 使用ModelEngine实体创建的自定义风筝示例（也支持动画ModelEngine实体模型）
  meg_star_kite:
    enabled: true
    display_name: "星星风筝 (MEG)"
    type: MEG_BALLOON_ENTITY
    # 在GUI中显示不同的物品（在这种情况下是必需的，因为ModelEngine实体不能放在GUI中）
    model:
      gui: potion:400016
      normal: star_kite
    dye:
      enabled: true

  meg_ballon_cluster:
    enabled: true
    display_name: "气球簇 (MEG)"
    type: MEG_BALLOON_ENTITY
    model:
      gui: potion:400015
      normal: ballon_cluster
    dye:
      enabled: false

  meg_locomotive:
    enabled: true
    display_name: "火车头 (MEG)"
    type: MEG_BALLOON_ENTITY
    model:
      gui: potion:400017
      normal: locomotive
    dye:
      enabled: false