    player-not-found: '&c未找到名为 ''&6$1&c'' 的玩家!'
    console-needs-player: '&c从控制台运行此命令时,需要指定玩家!'
    already-in-dungeon: '&c你已经在一个地牢中!'
    already-in-queue: '&c你已经在排队等候其他地牢!'
