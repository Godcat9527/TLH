    requirements-not-met: '&6&l$1 &c不符合进入该地牢的条件!'
    instances-full: '&c当前所有地牢都已满! 当有空闲地牢时向你发送提醒消息.'
    how-to-cancel: '&b你正在排队等待一个地牢! 使用 &6/leave &b取消排队等待.'
  lives:
    not-in-dungeon: '&c你当前不在地牢中!'
    infinite-lives: '&e你有 &6无限 &e次复活机会.'
    # $1 = 剩余复活次数.
    lives-remaining: '&e你还有 &6$1 &e次复活机会.'
  join:
    not-in-dungeon: '&c这名玩家当前不在地牢中!'
