# 支持 '&' 颜色代码和十六进制代码! 十六进制代码格式: <#000000>
# 使用 $1, $2, 等. 代表参数
general:
  prefix: <#9753f5>[地牢]
  # 功能编辑器工具的物品显示名称.
  function-editor-name: '&6功能构建器'
  function-editor-lore:
  - '&6----------------------'
  - '&e右键点击一个方块'
  - '&e来创建一个功能!'
  room-editor-name: '&d房间编辑器'
  room-editor-lore:
  - '&d----------------------'
  - '&e右键选择第一个角落.'
  - '&e左键选择第二个角落.'
  - ''
  - '&e在房间内右键点击'
  - '&e以编辑房间的设置.'
  # 用于某些复杂系统消息的语言.(例如冷却时间消息)
  # 语言列表可以在这里找到:https://www.oracle.com/java/technologies/javase/jdk8-jre8-suported-locales.html#util-text
  # 注意:并非所有翻译都可能被支持!
  java-locale: zh-CN

# #####################
# # 命令消息 ##
# #####################
# 命令显示的消息.

