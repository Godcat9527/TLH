General:
  # 请勿更改!用于在重大更新时跟踪配置版本.
  Version: 1
  DungeonType: CLASSIC
  # 用于此地牢中的区块生成器.其他插件也可以提供这些生成器.
  # natural = 默认的超平坦世界.
  # mythicdungeons:void = 经典的虚空生成器, 由 Mythic Dungeons 提供.
  # mythicdungeons:block.[BLOCKTYPE] = 生成特定方块的整个区块. (例如, mythicdungeons:block.STONE 将生成全部高度为石头的区块.)
  ChunkGenerator: natural
  # 这个地下城的显示名称,将在生成和启动时显示.
  DisplayName: "&b一个地牢"
  # 在地牢开始时是否在标题消息中向玩家显示上述显示名称.
  ShowTitleOnStart: false
  Lobby:
    Enabled: false
  # 玩家通过" 完成地牢 "功能离开地牢后出去的位置. (使用 /md setexit <dungeon> 命令.)
  ExitLocation: null
  # 是否始终在玩家离开时使用退出位置,而不仅仅在他们完成地牢时使用.
  AlwaysUseExit: false
  # 玩家在地牢中将处于什么游戏模式
  Gamemode: SURVIVAL
  # 玩家在无法复活之前可以死亡多少次. 0 表示玩家有无限复活次数.
  PlayerLives: 0
  # 是否将不可复活玩家置入旁观模式. 如果设置为 false, 玩家复活次数耗尽后将被从地牢中踢出.
  # 注意: 旁观者不能使用旁观者菜单退出地牢.
  DeadPlayersSpectate: true
  # 是否在所有玩家进入旁观模式后关闭地牢.如果设置为false, 地牢将保持开放状态, 直到所有玩家离开.
  # 如果设置为false, 玩家必须使用 /md leave 命令退出地牢.
  # 注意：此选项仅在 DeadPlayersSpectate 设置为true时有效.
  CloseDungeonWhenAllSpectating: true
  # 玩家进入地牢时是否保留物品栏.
  KeepInventoryOnEnter: true
  # 玩家进入地牢时是否保留当前生命值.
  # (否则,他们将在进入地牢时恢复到满血状态, 并在退出时恢复为之前的生命值.)
  KeepHealthOnEnter: false
  # 玩家进入地牢时是否保留当前饱食度.
  # (否则, 他们将在进入地牢时恢复到满饱食状态, 并在退出时恢复为之前的饱食度.)
  KeepFoodOnEnter: false
  # 玩家进入地牢时是否保留当前药水效果.
  # (否则, 他们将在进入地牢时清除所有药水效果.)
  KeepPotionEffectsOnEnter: false
  # 玩家进入地牢时是否保留当前经验和等级.
  KeepExpOnEnter: true
  # 是否踢出在地牢中断开连接的玩家.
  KickOfflinePlayers: true
  # 断开连接后等待多长时间(以秒为单位)才会将玩家踢出地牢.
  KickOfflinePlayersDelay: 300
  # 插件在删除旧备份之前保存的最大备份次数.
  MaxBackups: 7
  # 同一时间存在的此地牢实例的最大数量.
  MaxInstances: 5
  # 地牢自动结束后等待多长时间将玩家踢出(以分钟为单位). 0 将禁用时间限制.
  TimeLimit: 0
  # 当所有玩家都离开地牢后,需要等待多长时间(以 ticks 为单位)才能清理地牢. 0 将立即清理地牢.
  CleanupDelay: 0
  # 此地下城中允许的最大玩家数量.用于 CONTINUOUS（连续）地下城类型.
  MaxPlayers: 0

  # 当设置为 'true' 时, 当玩家从奖励功能中取走物品时, 它们将被放入奖励列表.
  # 完成地牢后, 玩家将获得这些奖励.
  GiveLootAfterCompletion: false
  # 战利品冷却使得玩家无法在最近已经获取的宝箱中再次获取物品.
  # 奖励功能可以单独配置, 或使用这部分提供的默认值.
  LootCooldown:
    Enabled: false
    # 冷却是基于每个箱子还是整个地牢. !!目前不起作用!!
    PerReward: true
    # 将其设置为 TIMER 将使得玩家在冷却结束前不能再次获取战利品.
    # 选项如 HOURLY 每小时, DAILY 每天, WEEKLY 每周, 和 MONTHLY 每月将让你设置获得战利品的冷却重置时间.
    CooldownType: DAILY
    # 如果类型设置为 TIMER, 则这是玩家可以再次获取战利品之前的分钟数.
    # 否则, 这是一天中重置冷却的时间(以小时为单位).
    CooldownTime: 0
    # 如果类型设置为 WEEKLY, 则 ResetDay 确定在每周中的哪一天重置冷却时间.
    # "Sunday" 星期日为 1, "Monday" 星期一为 2, "Tuesday" 星期二为 3, 以此类推.
    # 如果类型设置为 MONTHLY, 则 ResetDay 确定在每月中的哪一天重置冷却.
    # 如果 CooldownType 设置为 "TIMER", 则不起作用.
    ResetDay: 1

  # 进入冷却功能用于限制玩家在完成地牢后再次进入所用时间.
  # 注意: 谨慎使用此功能, 因为这可能导致玩家无法一起玩地牢, 如果其中一人最近已经进入过相同地牢!
  # 应该使用 "LootCooldown" 部分来避免此问题.
  AccessCooldown:
    Enabled: false
    # 玩家通关地牢时是否添加冷却时间 (通过 "完成地牢" 功能.)
    CooldownOnFinish: true
    # 玩家通过任何方式离开地牢时是否添加冷却时间.
    CooldownOnLeave: false
    # 玩家失去所有复活机会时是否添加冷却时间.
    CooldownOnLoseLives: false
    # 玩家开始进入地牢时是否添加冷却时间. 如果启用了大厅功能, 则在激活 "开始地牢" 功能之前不会添加冷却时间.
    CooldownOnStart: false
    # 将此设置为 TIMER 将使玩家在冷却结束之前无法再次进入这个地牢.
    # 选项如 HOURLY 每小时, DAILY 每天, WEEKLY 每周, 和 MONTHLY 每月将让你设置进入地牢的冷却重置时间.
    CooldownType: DAILY
    # 如果类型设置为 TIMER, 则这是玩家可以再次进入这个地牢之前冷却的分钟数.
    # 否则, 这是一天中重置冷却的时间(以小时为单位).
    CooldownTime: 0
    # 如果类型设置为 WEEKLY, 则 ResetDay 确定在每周中的哪一天重置冷却时间.
    # "Sunday" 星期日为 1, "Monday" 星期一为 2, "Tuesday" 星期二为 3, 以此类推.
    # 如果类型设置为 MONTHLY, 则 ResetDay 确定在每月中的哪一天重置冷却时间.
    ResetDay: 1
Requirements:
  # 玩家进入地牢必须拥有的权限列表.
  Permissions: []
  MinPartySize: 1
  MaxPartySize: 4
  # 玩家必须完成的地牢列表. 注意: "Finished" 表示在所需的地牢中使用了 "Finish Dungeon" 完成地牢功能.
  DungeonsComplete: []
  # 如果安装了基于 Vault 的经济系统, 则进入地牢需要支付的费用.
  Cost: 0
AccessKeys:
  # 玩家使用钥匙进入地牢时是否消耗钥匙.
  Consume: true
  # 有效的钥匙物品列表. 注意: 不建议从这里添加钥匙. 请使用 `/md addkey <dungeon>` 命令添加.
  # 支持 Mythic 物品, 并且默认为 Mythic 物品的最新版本 (基于其命名空间).
  KeyItems: []
Difficulty:
  # 是否为地牢启用难度级别.
  EnableDifficultyLevels: false
  # 玩家在玩游戏时是否显示难度选择菜单. 需要上面设置为true.
  EnableDifficultyMenu: false
  # 难度选项列表及其对地牢的影响. 你可以添加随意命名难度和随意数量的难度!
  # 与 "Dungeon Difficulty" 条件结合使用非常有用.
  Levels:
    HARD: # 示例
      # 在难度菜单中代表此难度的图标物品
      Icon:
        Material: DIAMOND
        #CustomModelData: 1
        Display: "&c困难"
        Lore:
          - "&c仅适合真正的游戏玩家."
      # 增加怪物生命值的比例 (1.2 表示 +20%)
      MobHealth: 1.5
      # 增加生成功能中生成怪物数量的比例 (1.2 表示 +20%)
      MobAmounts: 1.5
      # 增加怪物造成伤害的比例 (1.2 表示 +20%)
      MobDamage: 1.25
      # 增加所有Mythic怪物等级的数量
      BonusMythicLevels: 1
      # 向战利品表和随机奖励功能中添加额外战利品的范围.
      # 警告:仅在Mythic Dungeons战利品表和 'random rewards' 功能上有效!
      # Mythic怪物的掉落表不会获得额外掉落. 相反, 请在Mythic掉落表中使用 `dungeondifficulty` 神话条件!
      BonusLoot: 1-3
Rules:
  SpawnMobs: false
  SpawnAnimals: false
  SpawnMonsters: false
  AllowBreakBlocks: false
  AllowPlaceBlocks: false
  AllowEnderpearl: false
  AllowChorusFruit: false
  AllowBucket: false
  # 限制放置不算作方块的物品, 例如船.
  AllowPlaceEntities: false
  # 有效地将地牢内的 RandomTickSpeed 设置为 0, 防止方块扩散, 植物生长, 冰融化, 等等.
  DisableRandomTick: true
  PreventPlantGrowth: true
  PreventExplosionBlockDamage: false
  PvP: false
  HideDeathMessages: false
  # 防止地牢外的玩家传送进来. 管理员可以通过 `dungeons.bypassjoin` 权限绕过. (或 `dungeons.bypassjoin.[dungeon_name]`)
  PreventTeleportIn: false
  # 是否允许在地牢中使用所有命令.
  AllowCommands: false
  # 即使 "AllowCommands" 设置为 false 时仍然可以使用的命令列表.
  AllowedCommands:
    - party
    - dparty
    - p
    - dungeon leave
    - md leave
    - leave
  # 即使 "AllowCommands" 设置为 true 也不能使用的命令列表.
  DisallowedCommands: []
  # 原版Minecraft禁止使用的物品材料列表. (必须是有效的 Spigot 材料.)
  BannedItems: []
  # 禁止在地牢中使用的更详细的物品列表. (建议使用 /md banitem 命令而不是直接修改此处.)
  CustomBannedItems: []
  # 切换是否可以拾取地牢中地面上的禁止物品.
  AllowPickupBannedItems: false
  # 切换是否可以在地牢中制作禁止物品.
  AllowCraftBannedItems: false
  # 切换禁止物品是否可以放入或从地牢的存储容器中丢弃.
  AllowStorageBannedItems: false
  # 允许在此地牢中放置的方块的白名单, 而不受 "AllowPlaceBlocks" 规则的限制.
  # 删除符号 [] 并像注释中所示的那样将方块添加到列表中.
  BlockPlaceWhitelist: []
  # - DIAMOND_ORE
  # - GOLD_ORE
  # 允许在此地牢中破坏的方块的白名单, 而不受 "AllowBreakBlocks" 规则的限制.
  BlockBreakWhitelist: []
  # 不允许在此地牢中放置的方块的黑名单, 而不受 "AllowPlaceBlocks" 规则的限制.
  BlockPlaceBlacklist: []
  # 不允许在此地牢中破坏的方块的黑名单, 而不受 "AllowBreakBlocks" 规则的限制.
  BlockBreakBlacklist: []
  # 是否允许玩家破坏他们在此地牢中放置的所有方块. 当 "AllowPlaceBlocks" 为 true, 而 "AllowBreakBlocks" 为 false 时有用.
  # 覆盖上述规则!!
  AllowBreakPlacedBlocks: false
  # 不能伤害的 Spigot 实体列表.
  DamageProtectedEntities: []
  # 不能与之交互的 Spigot 实体的列表. 用于保护物品展示框和盔甲架等物品.
  InteractProtectedEntities: []
  # 设置为 true 时, 则防止盔甲, 武器和/或工具在地牢中失去耐久度.
  PreventDurabilityLoss:
    Armor: false
    Weapons: false
    Tools: false