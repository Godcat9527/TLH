  outdoor_bench:
    display_name: '户外长椅'
    permission: outdoor
    resource:
      material: PAPER
      generate: false
      model_path: furniture/outdoor/outdoor_bench
      model_id: 5036
    behaviours:
      furniture:
        gravity: false
        fixed_rotation: true
        small: false
        solid: true
        opposite_direction: false
        placeable_on:
          floor: true
          ceiling: false
          walls: false
        hitbox:
          length: 1
          width: 2
          height: 1
          width_offset: -0.5
        sound:
