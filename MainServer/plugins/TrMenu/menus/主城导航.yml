title: '&6&lTLH &a&l主城导航'

Layout:
  - '#@@@ @ @#'
  - '#@ @@@@ #' 
  - '# ==+== #'  
  - '#@ @@@@@#'  
  - '#@@@@@ @#'  
  - '#@@@ @@@#'

Icons:
 
  '@':
    display:
      material: green_stained_glass_pane
      name: ' '

  '#':
    display:
      material: gray_stained_glass_pane
      name: ' '

  '=':
    display:
      material: light_blue_stained_glass_pane
      name: ' '

  '+':
    display:
      material: grass_block
      name: '&b前往生存世界'
      lore:
        - ''
        - '&f从此处开启你的旅程！'
    action:
      all:
        - 'console: rtp player %player_name% world'
        - 'close'

  'Spawn':
