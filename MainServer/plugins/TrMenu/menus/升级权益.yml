      material: light_blue_stained_glass_pane #图标的材质
      name: '&7当前处于 &e升级权益'
      lore: 
      - ''
      - '&a👍 服务器会变质,但绝不会倒闭！'
    action: #按钮的动作
      all: #所有均可触发
        - 'sound: BLOCK_NOTE_BLOCK_COW_BELL' #播放声音

  '#':
    display: 
      material: red_stained_glass_pane 
      name: '&c返回主菜单'
    action: 
      all: 
        - 'open: 主菜单' 
        - 'sound: BLOCK_NOTE_BLOCK_COW_BELL' 


  a: 
    display: 
      material: sugar{model-data=1006}
      name: '&f' #一样的物品名字
      lore: #一样的物品描述
      - ''
