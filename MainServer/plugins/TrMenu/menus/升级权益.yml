  A: 
    display: 
      material: sugar{model-data=1012}
      name: '&6&l购买&f' 
      lore: 
      - ''
      - ''
      - '&f✦ 需支付: &e350星辰点'
      - '&f✦ 获得服务: &f'
      - '&f✦ 获得权益天数: &a30天'
