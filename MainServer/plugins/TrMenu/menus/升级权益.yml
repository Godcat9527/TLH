      - '&f✦ 你剩余的权益天数: *%luckperms_group_expiry_time_vip%*'
      - ''
      - '&a▶ 点击升级或续费'
    actions: #一样的动作部分
       left:
        - condition: check papi *%playerpoints_points% >= *350 
          actions:
            - 'close'
            - 'take-points: 350'
            - 'title: &a感谢支持！'
            - 'tell: &a你已经成功购买&f，并获得30天的支持!'                                   
