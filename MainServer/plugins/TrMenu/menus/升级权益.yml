Title: '&6&lTLH &a&l权益升级' 


Layout:
  - '$$$$$$$$$' #菜单的边框
  - '$$a$$$b$$'
  - '$$A$$$B$$' #菜单的主图标
  - '$$$$#$$$$' #菜单的边框



Icons: #正式开始写图标咯
  '$': # 叫做 #的图标，写在layout里面了
