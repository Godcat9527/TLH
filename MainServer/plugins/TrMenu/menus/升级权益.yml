    actions: 
      all: 
        - 'sound: BLOCK_NOTE_BLOCK_COW_BELL' 


  b: #一个叫做A的图标
    display: #一样的显示部分
      material: sugar{model-data=1011}
      name: '&f' #一样的物品名字
      lore: #一样的物品描述
      - ''
      - '&f专属&f:'
      - ''
      - ' &a ① &f有效期内&b&l解锁&f的全部功能&f;'
      - ' &a ② &f签到额外获取更多&b&l云翼能量&f;'
