player_help: |-
  &a&n玩家命令：
  &e/quests me &a: 查看自己的任务
  &e/quests show <global/easy/medium/hard> &a: 查看某个类别的任务
admin_help: |-
  &c&n管理员命令：
  &e/qadmin complete <player> <index> &a: 完成玩家的任务
  &e/qadmin reset <quests/total> <player> &a: 为玩家绘制新任务，或重置他完成的总任务数。
  &e/qadmin show <player> &a: 查看玩家的任务
