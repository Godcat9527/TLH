header-footer:
  enabled: true
  header:
  - ''
  - '&f✤ %animation:server% &f✤'
  - ''
  - '#D8BFD8&l当前在线人数:&f &l%server_online%/2024'
  - ''
  footer:
  - ''
  - ''
  - '#E9967A&l服务器版本:#E1FFFF&l1.21.4 #FFF68F&l交流群:#E1FFFF&l866631779#E1FFFF#87CEFA&l
    时间:#E1FFFF&l%time%#E1FFFF'
  - ''
  per-world: []
  disable-condition: '%world%=disabledworld'
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'
scoreboard-teams:
  enabled: false
  enable-collision: true
  invisible-nametags: false
  sorting-types:
  - GROUPS:owner,admin,mod,helper,builder,vip,default
  - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: true
  disable-condition: '%world%=disabledworld'
  can-see-friendly-invisibles: false
belowname-objective:
  enabled: false
  disable-condition: '%world%=disabledworld'
  fancy-value-default: NPC
  fancy-value: '&c%health%'
  value: '%health%'
  title: '&cHealth'
prevent-spectator-effect:
  enabled: false
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: PROGRESS
      color: '%animation:barcolors%'
      progress: '100'
      text: '&fWebsite: &bwww.domain.com'
per-world-playerlist:
  enabled: false
  allow-bypass-permission: false
  ignore-effect-in-worlds:
  - ignoredworld
  - build
  shared-playerlist-world-groups:
    lobby:
    - lobby1
    - lobby2
    minigames:
    - paintball
    - bedwars
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  use-numbers: false
  static-number: 0
  delay-on-join-milliseconds: 0
  scoreboards:
    admin:
      display-condition: permission:tab.scoreboard.admin
      title: '&f『#FFF8DC&lTLH生存次世代&f』'
      lines:
      - ''
      - '#54FF9F&l玩家信息'
      - ' #FFE4E1佩戴称号: &8[&r%playertitle_use%&8]'
      - ' #FFE4E1星辰点: &8[&d%playerpoints_points% ⛂&8]'
      - ' #FFE4E1星币: &8[&e%vault_eco_balance_formatted%$&8]'
      - ' #FFE4E1游戏时长: &8[#FFFACD%cmi_user_playtime_hoursf%小时&8]'
      - '#00BFFF&l游戏信息 '
      - ' #FFE4E1服务器TPS:%server_tps_1_colored%'
      - ' #FFE4E1/gcd 获得快捷菜单'
      - ' #F0FFF0/spawn&f 前往主城'
      - ''
      - '#FF8C69&l服务器群号:866631779'
    scoreboard1:
      title: '&f『#FFF8DC&lTLH生存次世代&f』'
      lines:
      - ''
      - '#54FF9F&l玩家信息'
      - ' #FFE4E1佩戴称号: &8[&r%playertitle_use%&8]'
      - ' #FFE4E1星辰点: &8[&d%playerpoints_points% ⛂&8]'
      - ' #FFE4E1星币: &8[&e%vault_eco_balance_formatted%$&8]'
      - ' #FFE4E1游戏时长: &8[#FFFACD%cmi_user_playtime_hoursf%小时&8]'
      - '#00BFFF&l游戏信息 '
      - ' #FFE4E1服务器TPS:%server_tps_1_colored%'
      - ' #FFE4E1/gcd 获得快捷菜单'
      - ' #F0FFF0/spawn&f 前往主城'
      - ''
      - '#FF8C69&l服务器群号:866631779'
ping-spoof:
  enabled: false
  value: 0
placeholders:
  date-format: dd.MM.yyyy
  time-format: '[HH:mm:ss]'
  time-offset: 0
placeholder-output-replacements:
  '%essentials_vanished%':
    'yes': '&7| Vanished'
    'no': ''
  '%afk%':
    true: ' &o[AFK]&r'
    false: ''
  '%essentials_nickname%':
    '%essentials_nickname%': '%player%'
conditions:
  nick:
    conditions:
    - '%player%=%essentials_nickname%'
    true: '%player%'
    false: ~%essentials_nickname%
assign-groups-by-permissions: false
primary-group-finding-list:
- Owner
- Admin
- Mod
- Helper
- default
debug: false
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
use-online-uuid-in-tablist: true
global-playerlist:
  enabled: false
  update-latency: false
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:1753261242
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts:
    staff:
      condition: permission:tab.staff
      fixed-slots:
      - '1|&3RAM&f:'
      - 2|&b%memory-used%MB / %memory-max%MB
      - '3|&8&m                       '
      - '4|&3TPS&f:'
      - 5|&b%tps%
      groups:
        staff:
          condition: permission:tab.staff
          slots:
          - 24-40
        players:
          slots:
          - 44-80
    default:
      fixed-slots:
      - '1|&3Website&f:'
      - 2|&bmyserver.net
      - '3|&8&m                       '
      - '4|&3Name&f:'
      - 5|&b%player%
      - '7|&3Rank&f:'
      - '8|Rank: %group%'
      - '10|&3World&f:'
      - 11|&b%world%
      - '13|&3Time&f:'
      - 14|&b%time%
      - '21|&3Teamspeak&f:'
      - 22|&bts.myserver.net
      - '23|&8&m                       '
      - '41|&3Store&f:'
      - 42|&bshop.myserver.net
      - '43|&8&m                       '
      groups:
        staff:
          condition: permission:tab.staff
          slots:
          - 24-40
        players:
          slots:
          - 44-80
playerlist-objective:
  enabled: false
  value: '%ping%'
  disable-condition: '%world%=disabledworld'
  fancy-value: '&7Ping: %ping%'
  title: TAB
  render-type: INTEGER
permission-refresh-interval: 1000
proxy-support:
  enabled: true
  type: PLUGIN
  plugin:
    name: RedisBungee
compensate-for-packetevents-bug: false
placeholder-refresh-intervals:
  default-refresh-interval: 500
  '%server_uptime%': 1000
  '%server_tps_1_colored%': 1000
  '%server_unique_joins%': 5000
  '%player_health%': 200
  '%player_ping%': 1000
  '%vault_prefix%': 1000
  '%rel_factionsuuid_relation_color%': 1000
