prefix: '&4&lTAC &8»'
alerts:
  # This is the chat format that will be followed when a player fails a check.
  # Valid placeholders are %player% (player name), %max-vl% (max violations), %check% (name of check), %description% (check description),
  # %version% (player's client version), %dev% (* for whether or not the check is experimental), %vl% (violation level),
  # %ping% (the player's ping), %tps% (the server's TPS), and %type% (character denoting the type for the check, A, B, C, etc),
  # %severity% for changing colors depending on the violations (options found in severity option below), %x% (player's X-coordinate),
  # %y% (player's Y-coordinate), %z% (player's Z-coordinate), %world% (player's world), %complex-type% which will show a more
  # advanced name for the check, such as Speed (Ground) instead of Speed (Type B)
  format: '%prefix% &f%player% &7检测到 &f%check% %dev%&7(&f类型 %type%&7)%dev% &7[&4%vl%&7/&4%max-vl%&7]'
  # This is the hover text that will be displayed when you hover over the alert message in chat.
  # All of the same placeholders as the ones for the format are valid.
  hover-message:
  - '&7Ping: &c%ping% &8| &7TPS: &c%tps% &8| &7版本: &c%version% &8| &7客户端: &c%client-brand%'
  - ''
  - '&7描述:'
  - '&7%description%'
  - ''
  - '&7信息:'
  - '&7%info%'
  - ''
  - '&7点击传送到 &b%player%&7.'
  # This is the command that will be executed when you click the alert message. Unfortunately we are limited to one
  # command per ChatComponent so we use a little magic and make our own command that is able to execute a list of any commands.
  # Valid placeholders
  click-commands:
  - /vulcan clickalert %player%
  # The commands that will be run when you use /vulcan clickalert %player% (must be a player parameter)
  click-alert-command-commands:
  - tp %player%
  # The message that will be sent when you toggle on alerts. Valid placeholder are %prefix%.
  toggled-on-message: '%prefix% &7TAC 警报 &a启用&7!'
  # The message that will be sent when you toggle off alerts. Valid placeholder are %prefix%.
  toggled-off-message: '%prefix% &7TAC 警报 &c禁用&7!'
  # Whether or not alerts will be printed to the console.
  print-to-console: true
  # The format for printing alerts to the console
  console-format: '[TAC] %player% 检测到 %check% %dev%(Type %type%)%dev% (%vl%/%max-vl%)'
  # This is a fully customizable list of commands that will be executed each time a player flags a check, just in case
  # you want to do anything special when they flag without needing to use the API. All valid placeholders are the same
  # as listed above once again.
  custom-commands: []
  # You can use this section to color code your alerts or add chances to them depending on the violation level.
  severity:
    violations:
      '2': 4 # Values less than this number will be the color '1' below. Values greater than or equal to this number and less than '3' will be the color 2
      '3': 8 # Values greater than or equal to this number and higher than '2' will be the color '3' below
      '4': 12 # Values greater than or equal to this number and higher than '3' will be the color '4' below
      '5': 16 # Values greater than or equal to this number and higher than '4' will be the color '5' below
      '6': 16 # Values greater than or equal to this number and higher than '5' will be the color '6' below
      '7': 16 # Values greater than or equal to this number and higher than '6' will be the color '7' below
      '8': 16 # Values greater than or equal to this number and higher than '7' will be the color '8' below
      '9': 16 # Values greater than or equal to this number and higher than '8' will be the color '9' below
      '10': 16 # Values greater than or equal to this number and higher than '9' will be the color '10' below
    colors: # This also supports hex color codes (in 1.16!+)
      '1': '&a' # The color that this severity should be, whatever is less than '2' in the section above
      '2': '&e' # The color that this severity should be, whatever is less than '3' and greater than or equal to '2' in the section above
      '3': '&6' # The color that this severity should be, whatever is less than '4' and greater than or equal to '3' in the section above
      '4': '&c' # The color that this severity should be, whatever is less than '5' and greater than or equal to '4' in the section above
      '5': '&4' # The color that this severity should be, whatever is less than '6' and greater than or equal to '5' in the section above
      '6': '&4' # The color that this severity should be, whatever is less than '7' and greater than or equal to '6' in the section above
      '7': '&4' # The color that this severity should be, whatever is less than '8' and greater than or equal to '7' in the section above
      '8': '&4' # The color that this severity should be, whatever is less than '9' and greater than or equal to '8' in the section above
      '9': '&4' # The color that this severity should be, whatever is less than '10' and greater than or equal to '9' in the section above
      '10': '&4' # The color that this severity should be, whatever is less than '11' and greater than or equal to '10' in the section above
  # The symbol that will be displayed for the %dev% placeholder to denote experimental checks.
  experimental-symbol: '*'
verbose:
  # Verbose notifications are sent whenever a player increases the buffer on a check. Only really here for developer
  # purposes as it is very very spammy. All of the same info from above applies here. Not really recommended to be used
  # as it will just completely spam your chat.
  format: '%prefix% &f%player% &7verbosed &f%check% &7(&f%type%&7) %dev% &7[&4%percent%%&7]'
  hover-message:
  - '&7Ping: &c%ping% &8| &7TPS: &c%tps% &8| &7Version: &c%version%'
  - ''
  - '&7Description:'
  - '&7%description%'
  - ''
  - '&7Buffer:'
  - '&7%buffer%/%max-buffer%'
  - ''
  - '&7Click to teleport to &b%player%&7.'
  click-commands:
  - /tp %player%
  toggled-on-message: '%prefix% &7Vulcan 详细模式 &a已启用&7!'
  toggled-off-message: '%prefix% &7Vulcan 详细模式 &c已禁用&7!'
log-file:
  # 是否启用日志文件
  enabled: false
  # 当玩家未通过检查时记录的消息。
  # 有效的占位符有 %player%（玩家名称）、%max-vl%（最大违规数）、%check%（检查名称）、%description%（检查描述），
  # %version%（玩家客户端版本）、%dev%（检查是否为实验性的*）、%vl%（违规等级），
  # %ping%（玩家的延迟）、%tps%（服务器的TPS）以及 %type%（表示检查类型的字符，A、B、C等）。
  alert-message: '%player% 检测到 %check% %dev%(类型 %type%)%dev% [违规等级：%vl%] [延迟：%ping%]
    [TPS：%tps%] [版本：%version%] [客户端：%client-brand%]'
  # 当玩家因检查被惩罚时记录的消息。有效的占位符与上述相同。
  # 如果启用（见下一节），关于惩罚的更多细节也将记录到punishments.txt文件中。
  punishment-message: '%player% 因 %check% %dev%(类型 %type%)%dev% 被惩罚 [违规等级：%vl%] [延迟：%ping%]
    [TPS：%tps%] [客户端：%client-brand%]'
unloaded-chunks:
  # 是否应该因为玩家发送与未加载区块相等的运动而将其回退
  setback-enabled: false
  # 是否应该通知管理员，设置为空字符串 '' 以禁用此消息
  message: '%prefix% &c%player% &7因为处于未加载的区块而被回退!'
  # 玩家被回退前的最大刻数
  max-ticks: 40
punishment-file:
  # Whether or not the punishments.txt file is enabled.
  enabled: true
violation-reset:
  # Whether or not violations should reset automatically
  enabled: true
  # The interval (in minutes) in which violations should automatically be reset.
  interval-in-minutes: 8
  # Whether or not a message will be sent when violations are reset (this is only sent to staff who have /alerts enabled).
  message-enabled: true
  # The message that is sent (only to staff with /alerts enabled) when violations are reset.
  message: '%prefix% &7所有在线玩家的违规行为都已重置！'
client-brand-alerts:
  # 是否应该尝试解析玩家的客户端信息 - 关闭此选项将完全不会注册消息通道。
  resolve: true
  # 是否启用客户端信息警告。
  enabled: true
  # 不会发送警告的客户端品牌列表。这不需要完全匹配，例如 'lunar' 可以匹配 'lunarclient' 等。
  ignore-alerts-list:
  - vanilla
  # 当玩家加入服务器时发送的消息。有效的占位符有 %player%（玩家名称）、%prefix%（插件前缀），
  # %client-brand%（用户客户端品牌）和 %client-version%（用户客户端版本）。
  message: '%prefix% &c%player% &7客户端为 &f%client-brand%&7!'
  # 不允许的客户端品牌列表，当玩家使用这些客户端品牌时将被自动踢出。这里使用字符串比较，所以不需要完全匹配，例如 'forge' 会阻止 Forge，'lunar' 会阻止 lunar 等。
  blocked-client-brands: []
  unallowed-client-brand-kick-message: '&c你不能使用 %client-brand% 加入!'
  # 是否应该将客户端品牌警告发送到控制台
  console: false
  # 如果启用上述选项，则应该打印到控制台的消息
  console-message: '[TAC] %player% 使用了 %client-brand%!'
  # 是否启用客户端品牌白名单。未包含在下面列表中的客户端品牌将不被允许加入
  whitelist-enabled: false
  # 将被白名单允许的客户端品牌。这里使用字符串比较，所以不需要完全匹配，例如 'forge' 会允许 Forge，'lunar' 会允许 lunar 等。
  whitelisted-client-brands: []
connection:
  desync:
    kick-enabled: true
    max-ticks: 300
    kick-message: 内部异常：io.netty.handler.timeout.ReadTimeoutException
    staff-alert-message: '%prefix% &c%player% &7因与服务器不同步被踢出！&7(&c%ticks% &7刻)'
    console-message: '[TAC] &c%player% &7因与服务器不同步被踢出！&7(&c%ticks% &7刻)'
  transaction:
    kick-enabled: true
    max-delay: 45000
    kick-message: 内部异常：io.netty.handler.timeout.ReadTimeoutException
    staff-alert-message: '%prefix% &c%player% &7因未回复事务数据包被踢出！&7(&c%delay%毫秒&7)'
    console-message: '[TAC] &c%player% &7因未回复事务数据包被踢出！&7(&c%delay%毫秒&7)'
  keepalive:
    kick-enabled: true
    max-delay: 45000
    kick-message: 内部异常：io.netty.handler.timeout.ReadTimeoutException
    staff-alert-message: '%prefix% &c%player% &7因未回复保活数据包被踢出！&7(&c%delay%毫秒&7)'
    console-message: '[TAC] &c%player% &7因未回复保活数据包被踢出！&7(&c%delay%毫秒&7)'
  max-ping:
    kick-enabled: true
    max-ping: 20000
    max-ticks: 20
    kick-message: 内部异常：io.netty.handler.timeout.ReadTimeoutException
    staff-alert-message: '%prefix% &c%player% &7因延迟过高被踢出！&7(&c%ping%毫秒&7)'
    console-message: '[TAC] &c%player% &7因延迟过高被踢出！&7(&c%ping%毫秒&7)'
punishments:
  # 当玩家受到惩罚时发送的消息（仅发送给启用了 /alerts 的工作人员）
  message: '%prefix% &c%player% &7因 &f%check% &7(&f类型 %type%&7) &7[&4x%vl%&7] 受到惩罚'
  # 当玩家受到惩罚时将向整个服务器广播的消息
  broadcast:
  - '&7&m---»--*-------------------------------------*--«---'
  - '&cVulcan &7检测到 &c%player% &7作弊，已将其从服务器中移除。'
  - '&7&m---»--*-------------------------------------*--«---'
judgement-days:
  # 当有人执行 /jday start 时将向服务器广播的消息
  started-broadcast:
  - '&7&m---»--*-------------------------------------*--«---'
  - '&cTAC 审判系统 已经开始工作...'
  - '&7&m---»--*-------------------------------------*--«---'
  # 当 Judgement Day 结束时将向服务器广播的消息
  ended-broadcast:
  - '&7&m---»--*-------------------------------------*--«---'
  - '&c判罚已经结束... 有 %amount% 名玩家受到惩罚。'
  - '&7&m---»--*-------------------------------------*--«---'
  # 将执行的命令，%player% 表示被添加到 Judgement Day 的玩家（/jday add (名字)）
  commands:
  - ban %player% &c[TAC] 你已被审查系统封禁，如有疑问请联系管理员
  # 当 Judgement Day 中有人受到惩罚时将向服务器发送的广播
  broadcast:
  - '&7&m---»--*-------------------------------------*--«---'
  - '&c%player% &7被 &c[TAC] 审判系统&7 封禁。'
  - '&7&m---»--*-------------------------------------*--«---'
  # 玩家在审判日排队等待的时间间隔
  cooldown: 1000
  # 是否应该在指定的间隔自动运行审判日（如果上述选项为真）
  run-at-interval: false
  # 如果上述选项为true，它们应该运行的间隔（以刻计，20刻=1秒，默认=36000刻=30分钟）
  interval: 36000
freeze:
  # 当玩家在冻结状态下登出时将执行的自定义命令列表
  logged-out-while-frozen-commands: []
ghost-blocks-fix:
  enabled: true
  ghost-water-fix: true
  minimum-tps: 18.5
  ignore-legacy-via: true
  buffer:
    max: 3
    decay: 0.1
  setback: true
  update-blocks: false
  ticks: 3
  message-enabled: false
  message: '&c你走在了一个幽灵方块上。它已经被更新了！'
  staff-message-enabled: true
  staff-message: '%prefix% &c%player%''s &7位置因为站在幽灵方块上而被更新了！(%world%, %x%, %y%, %z%)
    &7[%ticks%]'
  print-to-console: true
  console-message: '%player% 位置因为站在幽灵方块上而被更新了！(%world%, %x%, %y%, %z%) &7[%ticks%]'
messages:
  no-permission: '&c你没有执行此命令的权限！'
  cant-execute-from-console: '&c你不能从控制台执行此命令！'
  ban-command-syntax: '%prefix% &7正确语法: &c/vulcan ban (玩家)&7.'
  kb-command-syntax: '%prefix% &7正确语法: &c/vulcan knockback (玩家) &8| &c/vulcan kb (玩家)&7.'
  profile-command-syntax: '%prefix% &7正确语法: &c/vulcan profile (玩家)&7.'
  jday-command-syntax: '%prefix% &7正确语法: &c/jday add (玩家) &8| &c/jday execute &8|
    &c/jday list &8| &c/jday remove (玩家)&7.'
  reload-success: '%prefix% &a成功重新加载 Vulcan!'
  invalid-target: '%prefix% &c找不到指定的玩家！'
  kb-test-success: '%prefix% &a成功对 %player% 执行击退测试！'
  jday-no-pending-bans: '%prefix% &c没有待处理的封禁！'
  jday-added-to-list: '%prefix% &c%player% &7已成功添加到列表！'
  reset-command: '%prefix% &7所有在线玩家的违规记录已重置！'
  no-next-page: '%prefix% &c没有下一页！'
  no-previous-page: '%prefix% &c没有上一页！'
  enabled-all-checks: '%prefix% &a启用了所有检查！'
  disabled-all-checks: '%prefix% &c禁用了所有检查！'
  enabled-all-punishments: '%prefix% &a启用了所有惩罚！'
  disabled-all-punishments: '%prefix% &c禁用了所有惩罚！'
  disabled-check: '%prefix% &c禁用了检查 %check%！'
  enabled-check: '%prefix% &a启用了检查 %check%！'
  disabled-punishment: '%prefix% &c为 %check% 禁用了惩罚！'
  enabled-punishment: '%prefix% &a为 %check% 启用了惩罚！'
  disabled-hotbar-shuffle: '%prefix% &c为 %check% 禁用了热键栏测试！'
  enabled-hotbar-shuffle: '%prefix% &a为 %check% 启用了热键栏测试！'
  disabled-random-rotation: '%prefix% &c为 %check% 禁用了随机旋转！'
  enabled-random-rotation: '%prefix% &a为 %check% 启用了随机旋转！'
  disabled-broadcast-punishment: '%prefix% &c为 %check% 禁用了广播惩罚！'
  enabled-broadcast-punishment: '%prefix% &a为 %check% 启用了广播惩罚！'
  must-be-an-integer: '&c必须是整数！'
  must-be-positive: '&c必须是正数！'
  must-be-number: '&c必须是一个数字！'
  set-max-buffer: '%prefix% &a为 %check% 设置最大缓冲区到 %value%！'
  set-hotbar-shuffle-minimum-violations: '%prefix% &a为 %check% 设置洗牌热键栏的最小违规次数到 %value%！'
  set-hotbar-shuffle-interval: '%prefix% &a为 %check% 设置热键栏洗牌间隔到 %value%！'
  set-random-rotation-minimum-violations: '%prefix% &a为 %check% 设置随机旋转的最小违规次数到 %value%！'
  set-random-rotation-interval: '%prefix% &a为 %check% 设置随机旋转间隔到 %value%！'
  set-alert-interval: '%prefix% &a为 %check% 设置警报间隔到 %value%！'
  set-buffer-decay: '%prefix% &a为 %check% 设置缓冲区衰减到 %value%！'
  set-buffer-multiple: '%prefix% &a为 %check% 设置缓冲区倍数到 %value%！'
  set-max-violations: '%prefix% &a为 %check% 设置最大违规次数到 %value%！'
  set-minimum-violations-to-alert: '%prefix% &a为 %check% 设置警报的最小违规次数到 %value%！'
  set-maximum-ping: '%prefix% &a为 %check% 设置最大延迟到 %value%！'
  set-minimum-tps: '%prefix% &a为 %check% 设置最小 TPS 到 %value%！'
  removed-punishment-command: '%prefix% &a从检查 %check% 中移除了命令 %command%！'
  invalid-index-number: '%prefix% &c无效的索引号！'
  stopped-editing-punishment-commands: '%prefix% &c停止编辑惩罚命令！'
  added-punishment-command: '%prefix% &a添加了惩罚命令 %command% 到检查 %check%！'
  enter-punishment-command: '%prefix% &a输入你想要添加的命令！输入 STOP 或 CANCEL 退出！'
  remove-punishment-command: '%prefix% &c输入你想要移除的命令的索引。输入 STOP 或 CANCEL 退出！'
  disable-check-command-syntax: '%prefix% &c正确语法: /vulcan disablecheck (检查名称) - 区分大小写。'
  invalid-check: '%prefix% &c无效的检查名称！示例: AimA, BadPacketsF, AutoClickerJ.'
  removed-check: '%prefix% &c禁用了检查 %check%！'
  violations-command-syntax: '%prefix% &c正确语法: /vulcan violations (玩家)'
  no-logs: '%prefix% &c此玩家没有触发任何日志！'
  cps-command-syntax: '%prefix% &c正确语法: /vulcan cps (玩家)'
  connection-command-syntax: '%prefix% &c正确语法: /vulcan connection (玩家)'
  logs-command-syntax: '%prefix% &c正确语法: /logs (玩家) (页码)'
  no-logs-file: '%prefix% &c没有日志文件！'
  logs-command-no-logs: '%prefix% &c没有找到 %player% 的日志！'
  no-page: '%prefix% &c对于 %player% 没有第 %page% 页！'
  update-available: '%prefix% &7&cVulcan &7有新版本更新可用！(&cv%new-version%&7)'
  latest-version: '%prefix% &a你正在运行 Vulcan 的最新版本！'
  injection-failure: 你加入得太快了。请再试一次！
  frozen: '&c你被冻结了！请等待工作人员的指示。'
  logged-out-while-frozen: '%prefix% &c%player% 在冻结状态下登出了！'
  froze: '%prefix% &7你冻结了 &a%player%&7！'
  unfroze: '%prefix% &7你解冻了 &c%player%！'
  freeze-command-syntax: '%prefix% &c正确语法: /vulcan freeze (玩家)'
  shuffle-command-syntax: '%prefix% &c正确语法: /vulcan shuffle (玩家)'
  shuffled-hotbar: '%prefix% &a成功为 %player% 洗牌热键栏！'
  rotate-command-syntax: '%prefix% &c正确语法: /vulcan rotate (玩家)'
  randomly-rotated: '%prefix% &a成功随机旋转 %player%！'
  reset-command-syntax: '%prefix% &c正确语法: /vulcan reset (玩家)'
  violations-reset: '%prefix% &a成功重置了 %player% 的违规记录！'
  unknown-command: '%prefix% &c未知命令！'
  unfroze-staff-broadcast: '%prefix% &c%player% &7被 &c%staff%&7 解冻了！'
  froze-staff-broadcast: '%prefix% &c%player% &7被 &c%staff%&7 冻结了！'
  removed-from-jday: '%prefix% &a成功从 Judgement Day 中移除 %player%！'
  jday-remove-syntax: '%prefix% &c正确语法: /jday remove (玩家)'
  punishlogs-syntax: '%prefix% &c正确语法: /punishlogs (玩家)'
  sent-test-alert: '%prefix% &a成功执行测试警报！'
  description-command-syntax: '%prefix% &cProper Syntax: /vulcan description (checkname) '
commands:
  # Vulcan 帮助命令消息。
  help:
  - '&7&m---»--*-------------------------------------*--«---'
  - '&cVulcan 作弊检测 %version% 由 &cfrep (.frap) 开发'
  - '&r'
  - '&c/vulcan help &8- &7打开此帮助菜单'
  - '&c/vulcan profile &8 - &7显示玩家的 Vulcan 档案'
  - '&c/vulcan ban (玩家) &8- &7通过 Vulcan 封禁玩家'
  - '&c/vulcan reload &8- &7重新加载所有文件'
  - '&c/vulcan disablecheck (检查) &8- &7禁用一个检查（大小写敏感）'
