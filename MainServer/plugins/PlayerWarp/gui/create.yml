  price: 150

# 金币
vault:
  enable: true
  index: 15
  material: GOLD_INGOT
  isEnchant: false
  name: "   &8[&6ℑ&8] ▪ &8[&e金币创建&8]"
  custom-model-data: 0
  lore:
    - ''
    - '&7▪ 你还可创建 ${warpNumber} 个'
