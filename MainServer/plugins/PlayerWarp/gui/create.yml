  index: 13
  material: EMERALD
  isEnchant: false
  name: "   &8[&6ℑ&8] ▪ &8[&e自定义货币创建&8]"
  custom-model-data: 0
  lore:
    - ''
    - '&7▪ 你还可创建 ${warpNumber} 个'
