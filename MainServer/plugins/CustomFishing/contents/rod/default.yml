  custom-model-data: 50005
  max-durability: 32
  effects:
    effect_1:
      type: lava-fishing

magical_rod:
  material: fishing_rod
  display:
    name: '<b><#7B68EE>魔法钓鱼竿'
    lore:
      - ''
      - '<#7FFFD4>描述:'
      - '<gray> - 这款独特的钓鱼竿是魔法创新的产物，使用书作为鱼饵。'
      - '<gray> - 其复杂的卷线机构和魔法吸引力要求使用者的经验等级，'
      - '<gray> - 在每次投掷时消耗经验经验等级。'
      - ''
      - '<#FFD700>效果:'
      - '<gray> - 从钓鱼中获得附魔书。'
      - '<gray> - 需要较长时间来咬钩。'
      - ''
      - '<#CD5C5C>要求:'
      - '<gray> - 1x 书作为鱼饵'
      - '<gray> - 10 经验等级'
  custom-model-data: 50006
  max-durability: 16
  requirements:
    requirement_1:
      type: level
      value: 10
      not-met-actions:
        action_1:
          type: message
          value:
            - '你没有足够的经验等级来控制这根钓鱼竿.'
    requirement_2:
      type: bait
      value:
        - BOOK
      not-met-actions:
        action_message:
          type: message
          value:
            - '你必须用书作为鱼饵.'
  events:
    cast:
      action_level:
        type: level
        value: -10
  effects:
    effect_1:
      type: group-mod-ignore-conditions
      value:
        - enchantments:+10
    effect_2:
      type: wait-time-multiplier
      value: 3

