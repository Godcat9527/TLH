bone_rod:
  material: fishing_rod
  display:
    name: "<b><#CD2626>骨质钓鱼竿"
    lore:
      - ''
      - '<#7FFFD4>描述:'
      - '<gray> - 由古老骷髅的骨骼锻造而成，并注入了黑暗魔法的力量，'
      - '<gray> - 骨质钓鱼竿不是胆小者所用。它让勇者或疯子在炽热的'
      - '<gray> - 熔岩中垂钓，打破了常规钓鱼竿的限制。'
      - ''
      - '<#FFD700>效果:'
      - '<gray> - 在熔岩中钓鱼'
