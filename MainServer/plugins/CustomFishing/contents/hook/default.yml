# 注意: 这些是插件的默认配置
# 并不一定意味着玩家会有良好的游戏体验。我们希望您会根据自己的想法创建定制的配置，让玩家体验到您服务器的独特之处。

delicate_hook:
  material: SHEARS
  display:
    name: '<#1E90FF>精致鱼钩'
    lore:
      - ''
      - '<#7FFFD4>描述:'
      - '<gray> - 是工艺和魅力的化身，这个鱼钩'
      - '<gray> - 并非普通的渔具。它经经过精'
      - '<gray> - 心打磨和精心设计，它在水中'
      - '<gray> - 闪烁着完美的光泽,不可抗拒'
      - '<gray> - 地吸引着高质量的鱼儿。'
      - ''
      - '<#FFD700>效果:'
      - '<gray> - 提高获得高品质鱼类的几率'
  max-durability: 16
  custom-model-data: 50000
  # {dur} / {max}
  lore-on-rod:
    - ''
    - '<#7FFFAA>已装备鱼钩:'
    - '<gray> - 精致鱼钩: <white>{dur}</white> 剩余使用次数'
  effects:
    effect_1:
      type: group-mod
      value:
        - silver_star:+1
        - golden_star:+1