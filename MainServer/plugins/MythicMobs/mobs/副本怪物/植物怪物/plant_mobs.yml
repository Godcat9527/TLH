Mutant_Flower:
  Type: ZOMBIE
  Display: '&4&l巨型突变花'
  Health: 300
  Damage: 100
  Drops: 
  - cmd{c="ecrates key give %player_name% jichu 1"} 1
  BossBar:
    Enabled: true
    Title: '&4&l巨型突变花'
    Range: 25
    Color: RED
    Style: SEGMENTED_12
    DarkenSky: false
    DamageModifiers:
    - PROJECTILE 0.05
    - MAGIC 0.0
    - FIRE_TICK 1.8
  Options:
    MovementSpeed: 0.01
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: false
    Collidable: false
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 50
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Modules:
    ThreatTable: true
  DamageModifiers:
  - FALL 0
  AIGoalSelectors:
  - 0 clears
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - setAI{ai=false} @self ~onSpawn
  - model{mid=mutant_flower;n=false;step=1;lockpitch=true;lockyaw=true} @self ~onSpawn
  - effect:sound{s=entity.zoglin.ambient;volume=0.6;pitch=0.4} @self ~onTimer:140 0.35
  - effect:sound{s=entity.zoglin.ambient;volume=0.6;pitch=0.5} @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Mutant_Flower_Hit} @self ~onDamaged
  - skill{s=Summon_Vines} ~onSpawn
  
  - skill{s=Mutant_Flower_Vine_Root} @PIR{r=15} ~onTimer:40
  - skill{s=Mutant_Flower_Skill} ~onTimer:60 >50%
  - skill{s=Summon_Vines_RANDOM} ~onTimer:100 0.6 >50%
  - effect:particles{particle=redstone;color=#03ab65;size=0.6;amount=35;hS=2;vS=2;y=0.7;speed=0;forwardOffset=0;sideOffset=0} @self ~onTimer:20 >50%
  - skill{s=Mutant_Flower_Venom_Aura} @PIR{r=5} ~onTimer:40 >50%
  
  - skill{s=Mutant_Flower_Skill_2} ~onTimer:60 <50%
  - skill{s=Summon_Vines_RANDOM2} ~onTimer:100 0.6 <50%
  - effect:particles{particle=redstone;color=#4406cc;size=0.6;amount=35;hS=2;vS=2;y=0.7;speed=0;forwardOffset=0;sideOffset=0} @self ~onTimer:20 <50%
  - skill{s=Mutant_Flower_Venom_Aura2} @PIR{r=5} ~onTimer:40 <50%
  
  - skill{s=Mutant_Flower_Death} ~onDeath

