

Awakened_Shrub:
  Type: ZOMBIE
  Display: '&f苏醒的灌木'
  Health: 40
  Damage: 15
  Faction: Plant
  DamageModifiers:
   - PROJECTILE 0.50
   - MAGIC 0.0
   - FIRE_TICK 2.0
  Drops: 
  - cmd{c="ecrates key give %player_name% jichu 1"} 0.1
  Options:
    MovementSpeed: 0.22
    ShowHealth: false
    PreventRandomEquipment: true
    AlwaysShowName: false
    Persistent: false
    Despawn: true
    PreventOtherDrops: true
    FollowRange: 20
    Silent: true
    KnockbackResistance: 1
    PreventSunburn: true
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - 0 clear
  - 1 fleeplayers
  - 2 randomstroll
  AITargetSelectors:
  - 0 clear
  - 1 players
  Skills:
  - model{mid=awakened_shrub;n=false;step=1} @self ~onSpawn
  - effect:sound{s=entity.bee.pollinate;volume=0.8;pitch=1} @self ~onTimer:140 0.35
  - effect:sound{s=entity.bee.pollinate:samus.skeleton_idle;volume=0.8;pitch=1.2} @self ~onDeath
  - skill{s=Changetarget} ~onTimer:160 <99%
  - skill{s=Cancelattack;sync=true} ~onAttack
  - skill{s=Awakened_Shrub_Attack} ~onTimer:20 0.7
  - skill{s=Awakened_Shrub_Hit} ~onDamaged
  

