GoblinDeath1_sound:
  Skills:
  - sound{s=healong_goblin:healong.goblin.goblindeath1;v=1;sc=HOSTILE} @Self

GoblinDeath2_sound:
  Skills:
  - sound{s=healong_goblin:healong.goblin.goblindeath2;v=1;sc=HOSTILE} @Self

GoblinkingDEATH_sound:
  Skills:
  - delay 18
  - sound{s=healong_goblin:healong.goblin.goblinkingdeath;v=1;sc=HOSTILE} @Self

