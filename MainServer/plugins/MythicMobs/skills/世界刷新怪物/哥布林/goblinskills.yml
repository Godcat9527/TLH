CancelDamageEvent:
  Skills:
  - CancelEvent

GoblinonAttacksync:
  Skills:
  - CancelEvent
  - skill{s=GoblinonAttack} @Self

GoblinonAttack:
  Cooldown: 1
  Conditions:
  - incombat true
  - lastsignal{s=skill} false
  - offgcd
  Skills:
  - gcd{ticks=20}
  - signal{s=skill} @Self
  - state{mid=goblin;s=attack;li=3;lo=2} @Self
  - damage{a=8} @PIR{r=2}
  - sound{s=block.bamboo.place} @PIR
  - signal{s=clear} @Self
  
GoblinCombat:
  Skills:
  - defaultstate{m=goblin;t=walk;s=run;sp=3} @Self
  - setspeed{speed=2;type=walking} @Self

GoblinPeace:
  Skills:
  - defaultstate{m=goblin;t=walk;s=walk} @Self
  - setspeed{speed=1;type=walking} @Self

goblinarcherShoot:
  Cooldown: 3
  Conditions:
  - incombat true
  TargetConditions:
  - lineofsight true
  - fieldofview{angle=90} true
  - distance{d=<18}
  Skills:
  - state{mid=goblinarcher;s=walk;li=3;lo=2} @Self
  - state{mid=goblinarcher;s=attack;li=3;lo=2} @Self
  - potion{t=SLOW;l=7;d=20;p=false} @Self
  - delay 20
  - sound{s=item.crossbow.shoot} @Self
  - projectile{bulletType=ARROW;oT=GoblinShootTick;oH=GoblinShootHit;a=1;i=1;v=14;mr=25;hp=true;hR=0.2;vR=0.2} @Target

GoblinShootTick:
  Skills:
  - delay 3
  - effect:particles{p=reddust;c=#ffffff;a=1;hs=0;vs=0}

GoblinShootHit:
  Skills:
  - damage{a=12} @PIR{ignore=goblin,goblinarcher,goblinsoldier,goblinshaman,goblinking}

GoblinFireBall:
  Conditions:
  - incombat true
  - lastsignal{s=skill} false
  TriggerConditions:
  - lineofsight true
  Skills:
  - signal{s=skill} @Self
  - state{mid=goblinshaman;s=walk;li=3;lo=2} @Self
  - state{mid=goblinshaman;s=attack;li=3;lo=2} @Self
  - projectile{oT=GoblinFireBallTick;oH=GoblinFireBallHit;i=1;v=14;mr=15;sE=true}
  - sound{s=entity.ghast.shoot;p=0.7;v=2} @Self
  - delay 3
  - signal{s=clear} @Self

GoblinFireBallTick:
  Skills:
  - delay 3
  - effect:particles{p=reddust;c=#ff2e00;a=10;hs=0.2;vs=0.2} @Origin
  - effect:particles{p=reddust;c=#ffbc00;a=10;hs=0.1;vs=0.1} @Origin

GoblinFireBallHit:
  Skills:
  - damage{a=12}
  - effect:explosion @Origin
  - effect:particles{p=lava;s=-1;a=20;hs=0;vs=0} @Origin

GoblinHeal:
  Cooldown: 15
  Conditions:
  - lastsignal{s=skill} false
  - incombat true
  Skills:
  - signal{s=skill} @Self
  - potion{t=SLOW;l=7;d=60;p=false} @Self
  - sound{s=entity.witch.celebrate;p=1.9;v=1} @Self
  - state{mid=goblinshaman;s=heal;li=0;lo=0} @Self
  - delay 3
  - effect:particleorbital{particle=reddust;color=#7CFC00;amount=3;r=1;p=30;i=1;t=40;repeat=4;repeatInterval=7;vs=1} @Self
  - sound{s=entity.evoker.prepare_summon;p=0.8;v=0.5} @Self
  - delay 40
  - effect:particles{particle=villager_happy;a=20;y=1;s=1;hs=0.4;vs=0.4} @MobsInRadius{r=30;types=goblin,goblinarcher,goblinsoldier,goblinshaman,goblinking}
  - effect:particles{particle=villager_happy;a=30;y=1;s=1;hs=1;vs=1;y=1.5} @MobsInRadius{r=30;types=goblinking}
  - sound{s=healong_goblin:healong.goblin.shaman_heal;v=0.3;sc=HOSTILE} @self
  - effect:particles{particle=totem_of_undying;speed=0.4;amount=60;hs=.2;vs=1;y=4} @Self
  - heal{amount=50} @MobsInRadius{r=30;types=goblin,goblinarcher,goblinsoldier,goblinshaman,goblinking}
  - heal{amount=50} @Self
  - delay 3
  - state{mid=goblinshaman;s=walk;li=0;lo=0} @Self
  - delay 10
  - signal{s=clear} @Self

