##=============       ATTACK      =============##
MegBite:
  Cooldown: 2
  Conditions:
  - targetwithin{d=15} true
  - hasaura Attack false
  Skills: 
  - state{mid=leviathan;s=walk;li=0;lo=0;r=true} @self 
  - state{mid=leviathan;s=idle;li=0;lo=0;r=true} @self  
  - Aura{auraName=Attack;interval=1;duration=30} @self
  - state{mid=leviathan;s=bite;li=0;lo=0;r=false;i=false} @self
  - auraremove{aura=Moving;stacks=1} @self
  - delay 16
  - totem{ch=2;onStart=MegBiteTotem;int=10;hR=3;md=1} @Forward{f=7;y=0}
MegBiteTotem:
  Cooldown: 1
  Conditions:
  Skills: 
  - skill{s=MegBiteTotemDamageHigh} @EntitiesNearOrigin{r=8}
  - pull{velocity=4;repeat=5;repeatInterval=1} @EntitiesNearOrigin{r=8}
MegBiteTotemDamageHigh:
  TargetConditions:
  Cooldown: 0
  Skills:
  - damage{amount=12;pi=true;ignoreArmor=false}
  - effect:particles{p=block_crack;m=redstone_block;amount=15;speed=0;hS=0.3;vS=0.3;y=1}
  - delay 1
  - throw{velocity=3;velocityY=-1} @EntitiesNearOrigin{r=7}
  
##=============                   =============##
MegRip:
  Cooldown: 5
  Conditions:
  - targetwithin{d=15} true
  - hasaura Attack false
