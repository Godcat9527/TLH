          failure_permission:
            title: '缺少权限'
            content: '&c服务器不允许你在任何领土中切换此标志.'
          failure_allow-edit:
            title: 无法切换标志
            content: '&c服务器配置了此标志对于此角色不可切换.'
          failure_blacklist:
            title: '由领土控制的标志'
            content: |
              这个标志不能由国家切换.
               &8• &r这个国家的每个领土可以单独配置它.
          failure_edit_owner:
            title: '所有者角色'
            content: |
              你不能为自己的所有者角色切换此标志.
               &8• &r这可以防止你不小心剥夺自己的权限.
      player:
        untrust:
          failure_edit:
            content: |
              你不能编辑这个玩家.
