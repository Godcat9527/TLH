        failure_spawn_cooldown:
          title: '冷却时间'
          content: '你必须再等待&5 {time} &r才能再次传送到任何领土出生点.'
        failure_teleport_enter:
          title: '禁止入内'
          content: |
            你不被允许进入目的地所在的区域.
             &8• &r领土所有者可以给予你此权限.
        failure_spawn_cost:
          title: '没有足够的货币'
          content: '你需要支付&r {cost}&r 以进行出生点传送.'
        success_spawn_set:
          title: '出生点已设置'
          content: '你已将出生点设置在你当前的位置.'
