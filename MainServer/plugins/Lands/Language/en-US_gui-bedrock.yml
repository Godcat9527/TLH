            title: '所有者'
          failure_tenant:
            content: |
              &c租户不能不受信任或更改他们的角色.
                &8• &r可以通过执行&e/{cmd}&r来删除租户.
            title: '租户'
          failure_setrole:
            content: |
              &c你不能设置任何角色.
                 &8• &r领土所有者可以给予你的角色此权限.
            title: '不允许'
          failure_rented:
            content: |
              &c你不能取消对租客&4 {player}&c在区域&4{area}&c的信任.
                 &8• &r要移除该区域的出租状态,请站在区域内使用&e/{cmd}&r.
            title: '已出租'
          failure_self:
            content: |
              要离开领土,请使用&e/{cmd}&r.
            title: '不能取消信任自己'

