    Item:
      Material: HOPPER
      Name: <lred><b>过期的商品</b></lred> <lgray>[<white>%expired_amount%</white>]</lgray>
      Lore:
      - <lgray>上架后未能在一定时间内售出的商品</lgray>
      - <lgray>如果一直未取回，最终将会被清除。</lgray>
