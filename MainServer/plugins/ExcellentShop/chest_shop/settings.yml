  Creation:
    Cost:
      # Sets how much player have to pay in order to create a chest shop.
      Create: 0.0
      # Sets how much player have to pay in order to remove a chest shop.
      Remove: 0.0
    # List of worlds, where chest shop creation is not allowed.
    World_Blacklist:
    - another_world
    - custom_world
    # Sets amount of possible shops available for certain ranks/permissions.
    # Use '-1' for unlimited amount.
    Max_Shops_Per_Rank:
      # Available values: RANK, PERMISSION
      # ==================== RANK MODE ====================
      # Get value by player's permission group. All keys in 'Values' list will represent permission group names.
      # If player has none of specified groups, the 'Default_Value' setting will be used then
      #   Values:
      #     vip: 1 # -> Player must be in 'vip' permission group.
      #     gold: 2 # -> Player must be in 'gold' permission group.
      #     emerald: 3 # -> Player must be in 'emerald' permission group.
      #
      # ==================== PERMISSION MODE ====================
      # Get value by player's permissions. All keys in 'Values' list will represent postfixes for the 'Permission_Prefix' setting (see below).
      # If player has none of specified permissions, the 'Default_Value' setting will be used then
      #   Permission_Prefix: 'example.prefix.'
      #   Values:
      #     vip: 1 # -> Player must have 'example.prefix.vip' permission.
      #     gold: 2 # -> Player must have 'example.prefix.gold' permission.
      #     emerald: 3 # -> Player must have 'example.prefix.emerald' permission.
      Mode: RANK
      # Sets permission prefix for the 'PERMISSION' mode.
      Permission_Prefix: excellentshop.chestshop.shops.amount.
      Default_Value: 10
      Values:
        vip: 20
        admin: -1
    # Sets whether or not plugin will simulate block placing to make sure that player can crate shops there.
    # This setting should be enough as universal compatibility solution with claim/protection plugins.
    # Disable this only if you're experiencing major issues.
    Check_Build_Access: true
    In_Player_Claims_Only:
      # Sets whether or not players can create shops in their own claims only.
      # Supported Plugins: Lands, GriefPrevention, WorldGuard, Kingdoms
      Enabled: false
  Products:
    # Sets how many products a player with certain rank/permission can put in a shop at the same time.
    # Use '-1' for unlimited amount.
    Max_Products_Per_Shop:
      # Available values: RANK, PERMISSION
      # ==================== RANK MODE ====================
      # Get value by player's permission group. All keys in 'Values' list will represent permission group names.
      # If player has none of specified groups, the 'Default_Value' setting will be used then
      #   Values:
      #     vip: 1 # -> Player must be in 'vip' permission group.
      #     gold: 2 # -> Player must be in 'gold' permission group.
      #     emerald: 3 # -> Player must be in 'emerald' permission group.
      #
      # ==================== PERMISSION MODE ====================
      # Get value by player's permissions. All keys in 'Values' list will represent postfixes for the 'Permission_Prefix' setting (see below).
      # If player has none of specified permissions, the 'Default_Value' setting will be used then
      #   Permission_Prefix: 'example.prefix.'
      #   Values:
      #     vip: 1 # -> Player must have 'example.prefix.vip' permission.
      #     gold: 2 # -> Player must have 'example.prefix.gold' permission.
      #     emerald: 3 # -> Player must have 'example.prefix.emerald' permission.
      Mode: RANK
      # Sets permission prefix for the 'PERMISSION' mode.
      Permission_Prefix: excellentshop.chestshop.products.amount.
      Default_Value: 3
      Values:
        vip: 5
        admin: -1
    # When enabled, all items added as products in chest shops will be added with 1 amount no matter of the stack amount player used in.
    New_Products_Single_Amount: false
    # List of items that can not be added as shop products.
    # Vanilla Names: https://minecraft.wiki/w/Java_Edition_data_values -> Blocks / Items -> Resource location column.
    # Supported Plugins: ExcellentCrates, ExecutableItems, ItemsAdder, MMOItems, Nexo, Oraxen
    Material_Blacklist:
    - custom_item_123
    - barrier
    # Items containing the following words in their lore will be disallowed from being used as shop products.
    Lore_Blacklist:
    - ass hole bitch
    - fuck
    # Items containing the following words in their name will be disallowed from being used as shop products.
    Name_Blacklist:
    - sample text
    - shit
    Format:
      # Product lore format. Use '%lore%' placeholder to insert original lore of the product item.
      # You can use 'Chest Product' placeholders: https://nightexpressdev.com/excellentshop/placeholders
      Main:
      - '%lore%'
      - ''
      - '%buy%'
      - ''
      - '%sell%'
      - ''
      - <dgray>Hold <lgray>Shift</lgray> to buy & sell quickly.</dgray>
      # Lore that will appear if product is buyable.
      # Placeholder: %buy%
      Buy:
      - <green><b>BUY:</b></green>
      - <green>←<white> Left Click to buy for </white>%product_price_buy_formatted%</green>
      - '<green>✔<white> Items Left: </white>%product_stock_global_buy_amount_left%</green>'
      # Text to appear if product is sellable.
      # Placeholder: %sell%
      Sell:
      - <red><b>SELL:</b></red>
      - <red>→<white> Right Click to sell for </white>%product_price_sell_formatted%</red>
      - <red>→<white> Press [F] to sell all for </white>%product_price_sell_all_formatted%</red>
      - '<red>✔<white> Shop Space: </white>%product_stock_global_sell_amount_left%</red>'
Shop:
  Product:
    Bypass_Plugin_Detection:
      # When enabled, allows players to bypass plugin detection of the item they want to put as a shop product.
      Enabled: false
      # When enabled, bypass plugin detection for a shop products will work only when player holds the Shift key (sneaking).
      Hold_Shift: false
Display:
  # Sets an item that will be used as default shop showcase.
  # You can provide different showcases for different shop types you set in 'Allowed_Containers' option.
  # Use 'default' keyword to set showcase item for all unlisted here container types.
  # Available item options including model data: https://nightexpressdev.com/nightcore/configuration/item-formation/
  Showcase:
    default:
      Material: GLASS
    chest:
      Material: WHITE_STAINED_GLASS
  PlayerCustomization:
    # Sets whether or not players can customize displays for their shops personally.
    # This feature can also be regulated by the following permission: 'excellentshop.chestshop.display.customization.
    Enabled: true
    # List of items available to be used by players as shop showcases.
    Showcases:
      glass:
        Material: GLASS
      blue_glass:
        Material: BLUE_STAINED_GLASS
      black_glass:
        Material: BLACK_STAINED_GLASS
      gray_glass:
        Material: GRAY_STAINED_GLASS
      white_glass:
        Material: WHITE_STAINED_GLASS
      purple_glass:
        Material: PURPLE_STAINED_GLASS
      light_gray_glass:
        Material: LIGHT_GRAY_STAINED_GLASS
      orange_glass:
        Material: ORANGE_STAINED_GLASS
      lime_glass:
        Material: LIME_STAINED_GLASS
      light_blue_glass:
        Material: LIGHT_BLUE_STAINED_GLASS
      brown_glass:
        Material: BROWN_STAINED_GLASS
      green_glass:
        Material: GREEN_STAINED_GLASS
      red_glass:
        Material: RED_STAINED_GLASS
      cyan_glass:
        Material: CYAN_STAINED_GLASS
      pink_glass:
        Material: PINK_STAINED_GLASS
      magenta_glass:
        Material: MAGENTA_STAINED_GLASS
      yellow_glass:
        Material: YELLOW_STAINED_GLASS
  # Defines update interval for shop displays (in seconds).
  Update_Interval: 3
  # Sets shop display visibility distance.
  # Players will see shop displays when they are close enough.
  Visible_Distance: 10
  Title:
    # When 'true', creates a client-side hologram above the shop.
    Enabled: true
    Values:
      # Sets hologram text format for player and admin shops when both options, buying and selling, are available.
      # You can use 'Chest Shop' placeholders: https://nightexpressdev.com/excellentshop/placeholders
      # Display item name: %product_name%
      # Display item price: %product_price_buy%, %product_price_sell%
      # PlaceholderAPI is also supported here.
      ADMIN:
      - <lyellow><b>%shop_name%</b></lyellow>
      - <lgray>%product_name%</lgray>
      - '%buy% %sell%'
      # Sets hologram text format for player and admin shops when both options, buying and selling, are available.
      # You can use 'Chest Shop' placeholders: https://nightexpressdev.com/excellentshop/placeholders
      # Display item name: %product_name%
      # Display item price: %product_price_buy%, %product_price_sell%
      # Display item stock: %product_stock%
      # PlaceholderAPI is also supported here.
      PLAYER:
      - <lyellow><b>%shop_name%</b></lyellow>
      - <lgray>%product_name%</lgray>
      - '%buy% %sell%'
      - '<lgray>Stock: <lyellow>%product_stock%</lyellow></lgray>'
    # Sets hologram text for rentable shops.
    Rent:
    - <lyellow><b>For Rent</b></lyellow>
    - <lgray>%shop_rent_duration%</lgray>
    - <lgray>%shop_rent_price%</lgray>
    # Sets hologram text to appear for '%buy%' placeholder when buying option is available for displayed product.
    # Price placeholder: %product_price_buy%
    # All placeholders from 'Title -> Values' option are available here too.
    BuyValue:
      PLAYER: '<lgray><green>B: </green><lgreen>%product_price_buy%</lgreen></lgray>'
      ADMIN: '<lgray><green>B: </green><lgreen>%product_price_buy%</lgreen></lgray>'
    # Sets hologram text to appear for '%sell%' placeholder when selling option is available for displayed product.
    # Price placeholder: %product_price_sell%
    # All placeholders from 'Title -> Values' option are available here too.
    SellValue:
      PLAYER: '<lgray><red>S: </red><lred>%product_price_sell%</lred></lgray>'
      ADMIN: '<lgray><red>S: </red><lred>%product_price_sell%</lred></lgray>'
  Hologram:
    # When enabled, forces plugin to use Armor Stand entities instead of Display ones.
    Force_ArmorStands: false
    # Sets distance between hologram lines.
    LineGap: 0.3
Transaction_Logs:
  Output:
    File: true
    Console: true
  Format:
    Date: dd/MM/yyyy HH:mm:ss
    Purchase: '%type%: %player_name% - x%amount% of %item% for %price% in %shop_name% shop. [%shop_location_x%, %shop_location_y%, %shop_location_z% in %shop_location_world%, owned by %shop_owner%]'
