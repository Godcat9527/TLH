ChestShop:
  Command:
    Argument:
      Name:
        BuyPrice: buyPrice
        SellPrice: sellPrice
    List:
      Desc: List of [player's] shops.
    Bank:
      Desc: Open [player's] bank.
    Create:
      Desc: Create a shop.
    Browse:
      Desc: Player shops GUI.
    GiveItem:
      Desc: Give shop creation item.
      BadMaterial: <lred>Invalid shop type!</lred>
      Done: <lgray>Given <lyellow>%name%</lyellow> to <lyellow>%player_display_name%</lyellow>.</lgray>
    Remove:
      Desc: Removes the shop from the chest that you're looking at.
    Open:
      Desc: Open inventory of the target shop.
  Shop:
    Error:
      NotOwner: <lred>You don't own this shop!</lred>
      Inactive: This shop is not available currently.
    Creation:
      Info:
        Done:
        - <output:"titles:10:80:10"><sound:"block.note_block.bell;0.6;1.0">
        - <lgreen><b>Shop Created!</b></lgreen>
        - <lgray><lgreen>Right-Click</lgreen> while sneaking to open settings.</lgray>
      Error:
        AlreadyShop: <lred>This chest is already shop!</lred>
        NotEmpty: <lred>Please remove all items from the chest first.</lred>
        NotAChest: <lred>This block is not a chest!</lred>
        BadLocation: <lred>You can't create shop here!</lred>
        LimitReached: <lred>You have reached the limit of shops! You can't create more.</lred>
        BadArea: <lred>You can create shops only inside your own claim!</lred>
        NotEnoughFunds: <lred>You don't have enough funds!</lred>
    Removal:
      Error:
        NotEmpty: <lred>Please withdraw items from shop storage to remove it.</lred>
        NotAShop: <lred>This block is not a shop!</lred>
      Info:
        Done:
        - <output:"titles:10:80:10"><sound:"entity.generic.explode;0.6;1.0">
        - <lred><b>Shop Removed!</b></lred>
    Rename:
      Error:
        TooLong: <lred>Name is too long! Max. length is %amount%</lred>
    Teleport:
      Error:
        Unsafe: <lred>Teleport cancelled due to unsafe shop location.</lred>
    Trade:
      Buy:
        Info:
          User:
          - <noprefix>
          - <lyellow>You bought <orange>x%amount% %item%</orange> for <orange>%price%</orange> from <orange>%shop_name%</orange> shop.</lyellow>
          Owner:
          - <noprefix>
          - <lyellow><orange>%player_display_name%</orange> bought <orange>x%amount% %item%</orange> for <orange>%price%</orange> from your <orange>%shop_name%</orange> shop.</lyellow>
      Sell:
        Info:
          User:
          - <noprefix>
          - <lyellow>You sold <orange>x%amount% %item%</orange> for <orange>%price%</orange> to <orange>%shop_name%</orange> shop.</lyellow>
          Owner:
          - <noprefix>
          - <lyellow><orange>%player_display_name%</orange> sold <orange>x%amount% %item%</orange> for <orange>%price%</orange> to your <orange>%shop_name%</orange> shop.</lyellow>
    Bank:
      Error:
        InvalidCurrency:
        - <output:"titles:20:60:20">
        - <lred><b>Operation Failed!</b></lred>
        - <lgray>Incorrect currency!</lgray>
      Deposit:
        Success: <lgray>You deposit <lgreen>%amount%</lgreen> to shop bank!</lgray>
        Error:
          NotEnough: <lgray>You don't have enough funds!</lgray>
      Withdraw:
        Success: <lgray>You withdraw <lgreen>%amount%</lgreen> from shop bank!</lgray>
        NotEnough: <lgray>There is not enough funds in bank!</lgray>
    InfiniteStorage:
      Deposit:
        Success: <lgray>You deposit <lgreen>x%amount% %item%</lgreen> to shop storage!</lgray>
        Error:
          NotEnough: <lgray>You don't have enough items!</lgray>
      Withdraw:
        Success: <lgray>You withdraw <lgreen>x%amount% %item%</lgreen> from shop storage!</lgray>
        NotEnough: <lgray>There is not enough items in storage!</lgray>
  Product:
    Error:
      BadItem: <lred>This item can not be used in shop!</lred>
  Editor:
    Error:
      ProductLeft: <lred>You must take all of this product from the chest!</lred>
    PriceMenu: <black>Price Settings</black>
  Notification:
    ShopEarnings:
    - <noprefix>
    - ' '
    - <lgreen><b>Shops Income:</b></lgreen>
    - '<lgray>While you were offline your shops earned: <lgreen>%amount%</lgreen></lgray>'
    - ' '
  Search:
    ItemPrompt:
    - <output:"titles:20:-1:20"><sound:"block.lava.pop;0.6;1.0">
    - <lyellow><b>Shop Search</b></lyellow>
    - <lgray>Enter item <lyellow>name</lyellow> to search for.</lgray>
  Rent:
    Error:
      AlreadyRented:
      - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Already Rented!</b></lred>
      - <lgray>This shop is already rented by someone.</lgray>
      NotRented:
      - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Not Rented!</b></lred>
      - <lgray>You don't rent this shop.</lgray>
      NotRentable:
      - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Not Rentable!</b></lred>
      - <lgray>This shop is not available for rent.</lgray>
      InsufficientFunds:
      - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Insufficient Funds!</b></lred>
      - <lgray>You need <lred>%price%</lred> to rent this shop.</lgray>
    Prompt:
      Duration: <gray>Enter <green>[Days Amount]</green></gray>
      Currency: <gray>Enter <green>[Currency]</green></gray>
      Price: <gray>Enter <green>[Rent Price]</green></gray>
    Rent:
      Success:
      - <output:"titles:20:60:20"><sound:"block.iron_door.open;0.6;1.0">
      - <lgreen><b>Shop Rented!</b></lgreen>
      - <lgray>You rented this shop for <lgreen>%time%</lgreen>.</lgray>
    Extend:
      Success:
      - <output:"titles:20:60:20"><sound:"block.iron_door.open;0.6;1.0">
      - <lgreen><b>Rent Extended!</b></lgreen>
      - <lgray>You extended shop rent for <lgreen>%time%</lgreen>.</lgray>
Auction:
  SortType:
    NAME: Name
    MATERIAL: Material
    SELLER: Seller
    NEWEST: Newest
    OLDEST: Oldest
    MOST_EXPENSIVE: Most Expensive
    LEAST_EXPENSIVE: Least Expensive
  Command:
    Argument:
      Name:
        Price: price
    Open:
      Desc: Open auction.
    Sell:
      Desc: Add item on auction.
      Error:
        NoItem: <lred>You must hold an item to do that!</lred>
    Expired:
      Desc: List of expired listings.
    History:
      Desc: Your sales history.
    Selling:
      Desc: List of your current listings.
    Unclaimed:
      Desc: List of unclaimed rewards for your listings.
  Listing:
    Add:
      Success:
        Info:
        - <noprefix><sound:"block.note_block.bell;0.6;1.0">
        - ' '
        - <lgreen><b>✔ Success!</b></lgreen>
        - ' '
        - <lgray>You added <lgreen>x%listing_item_amount% %listing_item_name%</lgreen> on auction for <lgreen>%listing_price%</lgreen>!</lgray>
        - '<lgray>Tax amount: <lred>%tax%</lred></lgray>'
        - ' '
        Broadcast:
        - <noprefix>
        - ' '
        - <lyellow><b>Auction:</b></lyellow>
        - <lgray>Player <lyellow>%player_display_name%</lyellow> added <lyellow>x%listing_item_amount%</lyellow> <hover:show_item:"%listing_item_value%"><lyellow>%listing_item_name%</lyellow></hover> on the auction for <lyellow>%listing_price%</lyellow>.</lgray>
        - ' '
      Error:
        BadItem:
        - <sound:"entity.villager.no;0.6;1.0">
        - <lgray><lred>✘ %item%</lred> can not be added on the auction!</lgray>
        Limit:
        - <sound:"entity.villager.no;0.6;1.0">
        - <lgray><lred>✘</lred> You can't have more than <lred>%amount%</lred> active items on the auction!</lgray>
        Price:
          Tax:
          - <sound:"entity.villager.no;0.6;1.0">
          - '<lgray><lred>✘</lred> You can''t afford the <lred>%tax%</lred> price tax: <lred>%amount%</lred>!</lgray>'
          Currency:
            Min:
            - <sound:"entity.villager.no;0.6;1.0">
            - <lgray><lred>✘</lred> Minimal <lred>%currency_name%</lred> price is <lred>%amount%</lred>!</lgray>
            Max:
            - <sound:"entity.villager.no;0.6;1.0">
            - <lgray><lred>✘</lred> Maximal <lred>%currency_name%</lred> price is <lred>%amount%</lred>!</lgray>
          Negative:
          - <sound:"entity.villager.no;0.6;1.0">
          - <lgray><lred>✘</lred> Invalid price!</lgray>
          Material:
            Min:
            - <sound:"entity.villager.no;0.6;1.0">
            - <lgray><lred>✘</lred> Minimal <lred>x1 %item%</lred> price is <lred>%amount%</lred>!</lgray>
            Max:
            - <sound:"entity.villager.no;0.6;1.0">
            - <lgray><lred>✘</lred> Maximal <lred>x1 %item%</lred> price is <lred>%amount%</lred>!</lgray>
        DisabledGamemode:
        - <sound:"entity.villager.no;0.6;1.0">
        - <lgray><lred>✘</lred> You can't add items in your current gamemode!</lgray>
    Buy:
      Success:
        Info:
        - <output:"titles:20:60:20"><sound:"entity.player.levelup;0.6;1.0">
        - <lgreen><b>Successful Purchase!</b></lgreen>
        - <lgray>You bought <lgreen>x%listing_item_amount% %listing_item_name%</lgreen> from <lgreen>%listing_seller%</lgreen> for <lgreen>%listing_price%</lgreen>!</lgray>
      Error:
        NotEnoughFunds:
        - <output:"titles:20:60:20"><sound:"block.anvil.place;0.6;1.0">
        - <lred><b>Not Enough Funds!</b></lred>
        - <lgray>You need <lred>%listing_price%</lred>. You have <lred>%balance%</lred>.</lgray>
  Notify:
    Listing:
      Claim: <lgray><lgreen>✔</lgreen> You claimed <lgreen>%listing_price%</lgreen> for <lgreen>%listing_item_name%</lgreen>!</lgray>
      Unclaimed:
      - <noprefix>
      - ' '
      - <lyellow><b>Auction:</b></lyellow>
      - <lgray>You have <lyellow>%amount%</lyellow> unclaimed listing's incomes!</lgray>
      - ''
      - <lgray>Click <click:run_command:"/ah unclaimed"><hover:show_text:"<lgray>Click to claim your incomes!</lgray>"><lyellow><b>HERE</b></lyellow></hover></click> to claim now!</lgray>
      - ' '
      Expired:
      - <noprefix>
      - ' '
      - <lorange><b>Auction:</b></lorange>
      - <lgray>You have <lorange>%amount%</lorange> expired listings!</lgray>
      - ''
      - <lgray>Click <click:run_command:"/ah expired"><hover:show_text:"<lgray>Click to return your items.</lgray>"><lorange><b>HERE</b></lorange></hover></click> to return them.</lgray>
      - ' '
  UI:
    BuyConfirm:
      Listing:
        Name: '%listing_item_name%'
        Description:
        - '%listing_item_lore%'
        - '%empty-if-above%'
        - '<lgray>Price: </lgray><lyellow>%listing_price%</lyellow>'
        - '<lgray>Seller: </lgray><white>%listing_seller%</white>'
        Formatted: false
  Error:
    DisabledWorld: <lgray><lred>✘</lred> Auction is disabled in this world!</lgray>
