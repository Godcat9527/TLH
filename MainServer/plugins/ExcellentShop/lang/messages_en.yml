Days:
  MONDAY: Monday
  TUESDAY: Tuesday
  WEDNESDAY: Wednesday
  THURSDAY: Thursday
  FRIDAY: Friday
  SATURDAY: Saturday
  SUNDAY: Sunday
TradeType:
  BUY: Buy
  SELL: Sell
PriceType:
  FLAT: Flat
  FLOAT: Float
  DYNAMIC: Dynamic
  PLAYER_AMOUNT: Player Amount
ProductType:
  VANILLA: Vanilla
  COMMAND: Command
  PLUGIN: Plugin
Command:
  Argument:
    Name:
      Name: name
      Currency: currency
      Price: price
  Currency:
    Desc: Currency manager.
    Give:
      Desc: Give currency to a player.
      Done: <lgray>Given <lyellow>%amount% %currency_name%</lyellow> to <lyellow>%player_name%</lyellow>.</lgray>
    Take:
      Desc: Take currency from a player.
      Done: <lgray>Took <lyellow>%amount% %currency_name%</lyellow> from <lyellow>%player_name%</lyellow>.</lgray>
    Create:
      Desc: Create an item currency.
      Done:
        New: <lgray>Created a new currency <lgreen>%name%</lgreen> as <lgreen>%item%</lgreen>.</lgray>
      Error:
        Exist: <lgray>Currency <lred>%currency_id%</lred> already exists and is not an item currency.</lgray>
    Error:
      NoItem: <lred>You must hold an item to do that!</lred>
Module:
  Command:
    Reloaded: <lgray><lgreen>%name%</lgreen> reloaded!</lgray>
    Reload:
      Desc: Reload the module.
Error:
  Currency:
    Invalid: <lred>Invalid currency!</lred>
Shop:
  Product:
    Error:
      InvalidCartUI:
      - <sound:"entity.villager.no;0.6;1.0">
      - '<lred>Could not open purchase menu: Cart UI not found.</lred>'
      Unbuyable:
      - <sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Sorry! </b></lred><lgray>This product can't be purchased currently!</lgray>
      Unsellable:
      - <sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Sorry! </b></lred><lgray>This product can't be sold currently!</lgray>
      OutOfStock:
      - <sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Sorry! </b></lred><lgray>This product is out of stock!</lgray>
      OutOfSpace:
      - <sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Sorry! </b></lred><lgray>The shop is out of space!</lgray>
      OutOfFunds:
      - <sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Sorry! </b></lred><lgray>The shop is out of money!</lgray>
      FullStock:
      - <sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Sorry! </b></lred><lgray>This product is full of stock!</lgray>
      FullInventory:
      - <sound:"entity.villager.no;0.6;1.0">
      - <lred><b>Sorry! </b></lred><lgray>You have to clean up your inventory before purchase!</lgray>
      TooExpensive:
      - <output:"titles:15:60:15"><sound:"block.anvil.place;0.6;1.0">
      - <lred><b>Too Expensive!</b></lred>
      - <lgray>You need <lred>%price%</lred>!</lgray>
      NotEnoughItems:
      - <output:"titles:15:60:15"><sound:"block.anvil.place;0.6;1.0">
      - <lred><b>Not Enough Items!</b></lred>
      - <lgray>You need <lred>x%amount% %item%</lred>!</lgray>
  Cart:
    CustomAmount: <lgray>Enter your amount...</lgray>
Other:
  PriceDisabled: N/A
Editor:
  Price:
    Float:
      NoDays: No days set. Price won't refresh properly.
      NoTimes: No times set. Price won't refresh properly.
  Generic:
    BrokenItem:
      Name: <lred><b>< Invalid Item> </b></lred>
      Description:
      - <lgray>Item tag/ID is broken</lgray>
      - <lgray>or invalid.</lgray>
      Formatted: true
    Enter:
      Name: <lgray>Enter <lgreen>[Name]</lgreen></lgray>
      Amount: <lgray>Enter <lgreen>[Amount]</lgreen></lgray>
      Value: <lgray>Enter <lgreen>[Value]</lgreen></lgray>
      Day: <lgray>Enter <lgreen>[Day Name]</lgreen></lgray>
      Time: <lgray>Enter <lgreen>[Time]</lgreen> like <lgreen>22:00</lgreen></lgray>
      Seconds: <lgray>Enter <lgreen>[Seconds Amount]</lgreen></lgray>
  Product:
    Enter:
      Price: <lgray>Enter <lgreen>[Price]</lgreen></lgray>
      UniPrice: <lgray>Enter <lgreen>[Min] [Max]</lgreen></lgray>
      Currency: <lgray>Enter <lgreen>[Currency Identifier]</lgreen></lgray>
    Price:
      Reset:
        Name: Reset & Update
        Description:
        - Resets product's price data
        - and refreshes its values.
        Formatted: true
        CurrentInfo:
          Buy Price: '%product_price_buy_formatted%'
          Sell Price: '%product_price_sell_formatted%'
        ClickActions:
          LEFT: reset
      Type:
        Name: Price Type
        Description: []
        Formatted: true
        CurrentInfo:
          Current: '%product_price_type%'
        ClickActions:
          LEFT: change
      Currency:
        Name: Currency
        Description: []
        Formatted: true
        CurrentInfo:
          Current: '%product_currency%'
        ClickActions:
          LEFT: change
      Flat:
        Buy:
          Name: Buy Price
          Description: []
          Formatted: true
          CurrentInfo:
            Current: '%product_price_buy%'
          ClickActions:
            LEFT: change
            DROP_KEY: disable
        Sell:
          Name: Sell Price
          Description: []
          Formatted: true
          CurrentInfo:
            Current: '%product_price_sell%'
          ClickActions:
            LEFT: change
            DROP_KEY: disable
      Float:
        Buy:
          Name: Buy Price Bounds
          Description:
          - Sets product buy price bounds.
          - Final price will be within these values.
          Formatted: true
          CurrentInfo:
            Min: '%product_pricer_buy_min%'
            Max: '%product_pricer_buy_max%'
          ClickActions:
            LEFT: change
            DROP_KEY: disable
        Sell:
          Name: Sell Price Bounds
          Description:
          - Sets product sell price bounds.
          - Final price will be within these values.
          Formatted: true
          CurrentInfo:
            Min: '%product_pricer_sell_min%'
            Max: '%product_pricer_sell_max%'
          ClickActions:
            LEFT: change
            DROP_KEY: disable
        Decimals:
          Name: Cut Decimals
          Description:
          - Controls whether final price
          - should be integer.
          Formatted: true
          CurrentInfo:
            Enabled: '%product_pricer_float_round_decimals%'
          ClickActions:
            LEFT: toggle
        RefreshType:
          Name: Refresh Type
          Description:
          - <lyellow><b>Interval:</b></lyellow>
          - Performs refresh every X seconds.
          - ''
          - <lyellow><b>Fixed:</b></lyellow>
          - Performs refresh at given times.
          Formatted: true
          CurrentInfo:
            Current: '%product_pricer_float_refresh_type%'
          ClickActions:
            LEFT: toggle
        RefreshInterval:
          Name: Refresh Interval
          Description:
          - Sets refresh interval (in seconds).
          Formatted: true
          CurrentInfo:
            Current: '%product_pricer_float_refresh_interval%'
          ClickActions:
            LEFT: change
        RefreshDays:
          Name: Refresh Days
          Description:
          - '%product_pricer_float_refresh_days%'
          Formatted: true
          ClickActions:
            LEFT: add day
            RIGHT: remove all
        RefreshTimes:
          Name: Refresh Times
          Description:
          - '%product_pricer_float_refresh_times%'
          Formatted: true
          ClickActions:
            LEFT: add time
            RIGHT: remove all
      Dynamic:
        Initial:
          Name: Initial Values
          Description:
          - Sets initial (start) product price.
          Formatted: true
          CurrentInfo:
            Buy: '%product_pricer_dynamic_initial_buy%'
            Sell: '%product_pricer_dynamic_initial_sell%'
          ClickActions:
            LEFT: change buy
            RIGHT: change sell
        Step:
          Name: Price Step
          Description:
          - Adjusts prices by specified
          - values on each purchase/sale.
          Formatted: true
          CurrentInfo:
            Buy: '%product_pricer_dynamic_step_buy%'
            Sell: '%product_pricer_dynamic_step_sell%'
          ClickActions:
            LEFT: change buy
            RIGHT: change sell
      Players:
        Initial:
          Name: Initial Values
          Description:
          - Sets initial (start) product price.
          Formatted: true
          CurrentInfo:
            Buy: '%product_pricer_dynamic_initial_buy%'
            Sell: '%product_pricer_dynamic_initial_sell%'
          ClickActions:
            LEFT: change buy
            RIGHT: change sell
        Adjust:
          Name: Adjust Amount
          Description:
          - Adjusts prices by specified
          - values with a multiplier of
          - online players amount.
          Formatted: true
          CurrentInfo:
            Buy: '%product_pricer_players_adjust_amount_buy%'
            Sell: '%product_pricer_players_adjust_amount_sell%'
          ClickActions:
            LEFT: change buy
            RIGHT: change sell
        Step:
          Name: Adjust Step
          Description:
          - Adjusts prices for
          - every %product_pricer_players_adjust_step% player(s) online.
          Formatted: true
          CurrentInfo:
            Current: '%product_pricer_players_adjust_step%'
          ClickActions:
            LEFT: change
  Title:
    Shop:
      List: <black>Virtual Shop Editor</black>
      Settings: <black>Shop Settings</black>
      Layouts: <black>Shop Layouts</black>
      Rotations: <black>Shop Rotations</black>
      Rotation:
        Options: <black>Rotation Options</black>
        Times: <black>Rotation Times</black>
        Items: <black>Rotation Items</black>
        ItemSelection: <black>Select Product...</black>
        SlotSelection: <black>Select Slot(s)...</black>
    Product:
      Creation: <black>Product Creation</black>
      Settings: <black>Product Options</black>
      Stocks: <black>Product Stock Options</black>
      Price: <black>Product Price Options</black>
    Products:
      Normal: <black>Shop Products (Normal)</black>
      Rotating: <black>Shop Products (Rotating)</black>
VirtualShop:
  Command:
    Argument:
      Name:
        Shop: shop
    Editor:
      Desc: Open VirtualShop editor.
    Rotate:
      Desc: Force rotate a shop.
      Done: <lgray>Force rotated <lyellow>%shop_name%</lyellow> shop</lgray>
    Open:
      Desc: Opens specified shop.
      Done:
        Others: <lgray>Opened <lyellow>%shop_name%</lyellow> shop for <lyellow>%player_name%</lyellow>.</lgray>
    Menu:
      Desc: Opens Main Menu.
      Done:
        Others: <lgray>Opened shops menu for <lyellow>%player_name%</lyellow>.</lgray>
    Shop:
      Desc: Open specified shop or main menu.
    ShopAlias:
      Desc: Open %shop_name% shop.
    SellMenu:
      Desc: Open Sell GUI.
      Done:
        Others: <lgray>Opened sell menu for <lyellow>%player_name%</lyellow>.</lgray>
    SellAll:
      Desc: Quickly sell all items in inventory.
      Done:
        Others: <lgray>Forced player <lyellow>%player_name%</lyellow> to sell all items.</lgray>
    SellHand:
      Desc: Quickly sell hand item.
      Done:
        Others: <lgray>Forced player <lyellow>%player_name%</lyellow> to sell hand item.</lgray>
    SellHandAll:
      Desc: Quickly sell similar hand items.
  Shop:
    Rotation:
      Update:
      - <noprefix>
      - ' '
      - <lgray>New items just appeared in the <lyellow>%shop_name%</lyellow> shop!</lgray>
      - <lgray>Click <click:run_command:"/shop %shop_id%"><hover:show_text:"<lgray>Click to open shop!</lgray>"><lyellow><b>HERE</b></lyellow></hover></click> to open the shop!</lgray>
      - ' '
    Error:
      BadWorld: <lred>You can't use shop in this world!</lred>
      BadGamemode: <lred>You can't use shop in current gamemode!</lred>
      InvalidLayout: '<lgray>Could not open shop <lred>%shop_name%</lred>: Invalid shop layout!</lgray>'
      Invalid: <lgray><lred>%value%</lred> is not a valid shop!</lgray>
    Create:
      Error:
        Exist: <lred>Shop with such name already exists!</lred>
        BadName: <lred>Only latin letters and numbers are allowed!</lred>
  Product:
    Purchase:
      Sell:
      - <output:"titles:15:60:15"><sound:"entity.experience_orb.pickup;0.6;1.0">
      - <lgreen><b>Successful Sale!</b></lgreen>
      - <lgray>You sold <lgreen>x%amount% %item%</lgreen> for <lgreen>%price%</lgreen></lgray>
      Buy:
      - <output:"titles:15:60:15"><sound:"entity.experience_orb.pickup;0.6;1.0">
      - <lgreen><b>Successful Purchase!</b></lgreen>
      - <lgray>You bought <lgreen>x%amount% %item%</lgreen> for <lgreen>%price%</lgreen></lgray>
  SellMenu:
    NothingResult:
    - <output:"titles:15:60:15"><sound:"block.anvil.place;0.6;1.0">
    - <lred><b>Nothing to Sell!</b></lred>
    - <lgray>You don't have items to sell.</lgray>
    NothingDetails:
    - <noprefix>
    - ' '
    - <lred><b>Sale Details:</b></lred>
    - <lgray>There are no items in your inventory that can be sold.</lgray>
    - ' '
    - <lgray>If you have stacked Shulker Boxes or Chests with items inside,</lgray>
    - <lgray>split them by single stacks to sell.</lgray>
    - ' '
    SaleResult:
    - <output:"titles:15:60:15"><sound:"entity.experience_orb.pickup;0.6;1.0">
    - <lgreen><b>Items Sold!</b></lgreen>
    - <lgray>+%total%</lgray>
    SaleDetails:
    - <noprefix>
    - ' '
    - <lgreen><b>Sale Details:</b></lgreen>
    - '%entry%'
    - ' '
    - '<lgray>Total: <lgreen>%total%</lgreen></lgray>'
    - ' '
    SaleEntry: '<lgray>x%amount% <white>%item%</white>: <lgreen>%price%</lgreen> <dgray>(<white>%shop_name%</white>)</dgray></lgray>'
  Price:
    AverageDynamics:
      Up: <green>↑ %value%%</green>
      Down: <red>↓ %value%%</red>
  Error:
    Editor:
      RotationExists: <lred>Rotation with that name already exists!</lred>
  Editor:
    Product:
      NoRankRequirements: No rank(s) required!
      NoPermissionRequirements: No permission(s) required!
      NoForbiddenPerms: No permission(s) forbidden!
      Object:
        Static2:
          Name: <lyellow><b>%product_preview_name%</b></lyellow>
          Lore:
          - '<lyellow>● <lgray>Handler: </lgray>%product_handler%</lyellow>'
          - '<lyellow>● <lgray>Currency: </lgray>%product_currency%</lyellow>'
          - '<lyellow>● <lgray>Price Type: </lgray>%product_price_type%</lyellow>'
          - '<lyellow>● <lgray>Buy: </lgray>%product_price_buy%</lyellow>'
          - '<lyellow>● <lgray>Sell: </lgray>%product_price_sell%</lyellow>'
          - ''
          - <lgray>You can freely move this product</lgray>
          - <lgray>between slots, pages, and shops!</lgray>
          - ''
          - <lyellow>[▶]</lyellow> <lgray>Left-Click to <lyellow>edit</lyellow>.</lgray>
          - <lyellow>[▶]</lyellow> <lgray>Right-Click to <lyellow>pick</lyellow>.</lgray>
      Delete:
        Name: <lyellow><b>Delete Product</b></lyellow>
        Lore:
        - <lgray>Permanently deletes the product</lgray>
        - <lgray>with all settings and data.</lgray>
        - ''
        - <lyellow>[▶]</lyellow> <lgray>Click to <lyellow>delete</lyellow>.</lgray>
      Rotating:
        Object:
          Name: <lyellow><b>%product_preview_name%</b></lyellow>
          Lore:
          - '<lyellow>● <lgray>Handler: </lgray>%product_handler%</lyellow>'
          - '<lyellow>● <lgray>Currency: </lgray>%product_currency%</lyellow>'
          - '<lyellow>● <lgray>Price Type: </lgray>%product_price_type%</lyellow>'
          - '<lyellow>● <lgray>Buy: </lgray>%product_price_buy%</lyellow>'
          - '<lyellow>● <lgray>Sell: </lgray>%product_price_sell%</lyellow>'
          - ''
          - <lyellow>[▶]</lyellow> <lgray>Click to <lyellow>edit</lyellow>.</lgray>
        Create:
          Name: <lyellow><b>New Product</b></lyellow>
          Lore:
          - <lgray>Creates a new product</lgray>
          - <lgray>to use in rotation(s).</lgray>
          - ''
          - <lyellow>[▶]</lyellow> <lgray>Click to <lyellow>create</lyellow>.</lgray>
      FreeSlot:
        Name: <lyellow><b><green><b>Free Slot</b></green></b></lyellow>
        Lore:
        - ''
        - <lgray><lcyan><b>Quick Creation:</b></lcyan></lgray>
        - <lgray>Simply drag'n'drop item here!</lgray>
        - ''
        - <lgray><lpurple><b>Manual Creation:</b></lpurple></lgray>
        - <lgray>Click with empty cursor to</lgray>
        - <lgray>open creation wizard!</lgray>
      RotationSlot:
        Name: <lyellow><b><red><b>Rotation Slot</b></red></b></lyellow>
        Lore:
        - <lgray>Slot reserved for</lgray>
        - <lgray>rotating products.</lgray>
      ReservedSlot:
        Name: <lyellow><b><red><b>Reserved Slot</b></red></b></lyellow>
        Lore:
        - <lgray>This slot is occupied by a shop product.</lgray>
      Creation:
        Info:
          Name: <lyellow><b>Creation Wizard</b></lyellow>
          Lore:
          - ''
          - '<lgray><lyellow><b>Step #1</b></lyellow></lgray>'
          - <lgray>Click an item in your inventory</lgray>
          - <lgray>to select it as a base for new product.</lgray>
          - ''
          - '<lgray><lyellow><b>Step #2</b></lyellow></lgray>'
          - <lgray>Select and click product type button</lgray>
          - <lgray>to create a new product.</lgray>
        Item:
          Name: <lyellow><b>Item Product</b></lyellow>
          Lore:
          - <lgray>Gives item(s) directly to player's</lgray>
          - <lgray>inventory when purchased.</lgray>
          - ''
          - <lgray><green>✔</green> Custom Items</lgray>
          - <lgray><green>✔</green> NBT Support</lgray>
          - <lgray><green>✔</green> Placeholders</lgray>
          - <lgray><green>✔</green> Sellable</lgray>
          - ''
          - <lyellow>[▶]</lyellow> <lgray>Click to <lyellow>create</lyellow>.</lgray>
        Command:
          Name: <lyellow><b>Command Product</b></lyellow>
          Lore:
          - <lgray>Runs specified command(s) with</lgray>
          - <lgray>placeholders when purchased.</lgray>
          - ''
          - <lgray><green>✔</green> Custom Name</lgray>
          - <lgray><green>✔</green> Custom Lore</lgray>
          - <lgray><green>✔</green> Placeholders</lgray>
          - <lgray><green>✔</green> Unlimited Commands</lgray>
          - <lgray><red>✘</red> Unsellable</lgray>
          - ''
          - <lyellow>[▶]</lyellow> <lgray>Click to <lyellow>create</lyellow>.</lgray>
      Item:
        Name: <lyellow><b>Item</b></lyellow>
        Lore:
        - <lgray>Defines product's item.</lgray>
        - ''
        - <lyellow>[▶]</lyellow> <lgray>Drag & Drop to <lyellow>replace</lyellow>.</lgray>
        - <lyellow>[▶]</lyellow> <lgray>Right-Click to <lyellow>get a copy</lyellow>.</lgray>
      Preview:
        Name: <lyellow><b>Icon</b></lyellow>
        Lore:
        - <lgray>Defines product's icon.</lgray>
        - ''
        - <lyellow>[▶]</lyellow> <lgray>Drag & Drop to <lyellow>replace</lyellow>.</lgray>
        - <lyellow>[▶]</lyellow> <lgray>Right-Click to <lyellow>get a copy</lyellow>.</lgray>
      RespectItemMeta:
        Name: <lyellow><b>Match NBT</b></lyellow>
        Lore:
        - '<lyellow>● <lgray>Enabled: </lgray>%product_item_meta_enabled%</lyellow>'
        - ''
        - <lgray>Controls whether whole NBT</lgray>
        - <lgray>must match to sell this product.</lgray>
        - ''
        - <lgray>Otherwise any item with</lgray>
        - <lgray>the same type is accepted.</lgray>
        - ''
        - <lyellow>[▶]</lyellow> <lgray>Click to <lyellow>toggle</lyellow>.</lgray>
      PriceManager:
        Name: <lyellow><b>Price Manager</b></lyellow>
        Lore:
        - '<lyellow>● <lgray>Type: </lgray>%product_price_type%</lyellow>'
        - '<lyellow>● <lgray>Currency: </lgray>%product_currency%</lyellow>'
        - '<lyellow>● <lgray>Buy: </lgray>%product_price_buy%</lyellow>'
        - '<lyellow>● <lgray>Sell: </lgray>%product_price_sell%</lyellow>'
        - ''
        - <lgray>Sets product currency and price.</lgray>
        - ''
        - <lyellow>[▶]</lyellow> <lgray>Click to <lyellow>navigate</lyellow>.</lgray>
      RanksRequired:
        Name: <lyellow><b>Required Ranks</b></lyellow>
        Lore:
        - '%product_allowed_ranks%'
        - ''
        - <lgray>Only players with any of listed ranks</lgray>
        - <lgray>will have access to this product.</lgray>
        - ''
        - <lyellow>[▶]</lyellow> <lgray>Left-Click to <lyellow>add rank</lyellow>.</lgray>
        - <lyellow>[▶]</lyellow> <lgray>Right-Click to <lyellow>remove all & disable</lyellow>.</lgray>
      RequiredPerms:
        Name: Required Permissions
        Description:
        - '%product_required_permissions%'
        - ''
        - Only players with <green>any</green> of listed permissions
        - will have access to this product.
        Formatted: true
        ClickActions:
          LEFT: add permission
          RIGHT: remove all & disable
      ForbiddenPerms:
        Name: Forbidden Permissions
        Description:
        - '%product_forbidden_permissions%'
        - ''
        - Only players with <red>none</red> of listed permissions
        - will have access to this product.
        Formatted: true
        ClickActions:
          LEFT: add permission
          RIGHT: remove all & disable
      Commands:
        Name: <lyellow><b>Commands</b></lyellow>
        Lore:
        - '%product_commands%'
        - ''
        - <lgray>Runs listed command when</lgray>
        - <lgray>player purchases this item.</lgray>
        - ''
        - <lyellow>● <lgray>Use <lyellow>%player_name%</lyellow> for player name.</lgray></lyellow>
        - <lyellow>● <lgray><lyellow>PlaceholderAPI</lyellow> supported.</lgray></lyellow>
        - ''
        - <lyellow>[▶]</lyellow> <lgray>Left-Click to <lyellow>add command</lyellow>.</lgray>
        - <lyellow>[▶]</lyellow> <lgray>Right-Click to <lyellow>remove all</lyellow>.</lgray>
      Stock:
        Category:
          Name: <lyellow><b>Global & Player Stock</b></lyellow>
          Lore:
          - <lgray>Controls product limits on</lgray>
          - <lgray><lyellow>per server</lyellow> and <lyellow>per player</lyellow></lgray>
          - <lgray>basis.</lgray>
          - ''
          - <lyellow>[▶]</lyellow> <lgray>Click to <lyellow>navigate</lyellow>.</lgray>
        Global:
          BuyInitial:
            Name: <lyellow><b>Buy Stock</b></lyellow>
            Lore:
            - '<lyellow>● <lgray>Current: </lgray>%product_stock_global_buy_amount_initial%</lyellow>'
            - ''
            - <lgray>Sets the global buy stock.</lgray>
            - ''
            - <lyellow>[▶]</lyellow> <lgray>Left-Click to <lyellow>change</lyellow>.</lgray>
            - <lyellow>[▶]</lyellow> <lgray>Right-Click to <lyellow>set unlimited</lyellow>.</lgray>
          SellInitial:
            Name: <lyellow><b>Sell Stock</b></lyellow>
            Lore:
            - '<lyellow>● <lgray>Current: </lgray>%product_stock_global_sell_amount_initial%</lyellow>'
            - ''
            - <lgray>Sets the global sell stock.</lgray>
