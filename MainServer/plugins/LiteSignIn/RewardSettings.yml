                 #   - 'server:ecrates key give %player_name% whiteknight 2'

            #特别周签到时触发
            Special-Weeks:
                #周日
                7:
                    Override-default-rewards: false
                    Messages: 
                    - '{prefix}&a今天是周末，额外奖励一个金苹果！'
                    Reward-Items:
                    - 'golden_apple:1'
            #签到累计达到一定次数时触发
            Statistics-Times:
                100:
                    Messages: 
                    - '{prefix}&a签到次数总计达到100次，获得&e10000&a游戏硬币。'
                    Commands:
                    - 'server:eco give {player} 10000'
            #在特殊日期进行签到时触发
            Special-Dates:
                #格式: MM-dd （月-日）注意不要把如一月一号写成“1-1”，而是“01-01”
                '12-25':
                    Override-default-rewards: false
                    Messages: 
                    - '{prefix}&a今天是国庆节， 国庆节快乐！'
                    Reward-Items:
                    - 'golden_apple:32'
            #每日签到时得到指定名次时触发
            Special-Ranking:
                #全服第一名
                '1':
                    Override-default-rewards: false
