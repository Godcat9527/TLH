                    - 'server:flightcharge add {player} 2000 -s'
            #每月连续签到一定次数时触发
            Special-Times-Of-Month:
                #十五次
                15:
                    #生效的月份，请填入月份对应的数字
                    Valid-Months: [] #即为每年一月、二月、三月生效
                    #是否覆盖正常签到下的奖励
                    Override-default-rewards: false
                    Messages: 
                    - '{prefix}&a本月连续签到达到了15天，签到奖励&e翻倍&a！'
